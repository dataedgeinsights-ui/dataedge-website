      </div>
    </div>`);
    wrap.querySelector('#btn-back-err').addEventListener('click', ()=>{ state.step=3; render(); });
    wrap.querySelector('#btn-retry').addEventListener('click', ()=>{ state.step="loading"; render(); generatePackage(); });
    return wrap;
  }
  if(state.step==="loading" || (!state.result && !state.error)) return renderLoading();

  const r = state.result;
  const tabs = [
    ["timeline","Timeline"],["slides","Slide Deck"],["engagement","Discussion & Engagement"],

  ];
  const active = state.resultTab || "timeline";

  const wrap = el(`<div>
    <div class="card">
      <h2>${esc(r.session.sessionTopic || r.session.weekLabel || "Lecture Session")}</h2>
      <p class="hint">${esc(r.session.courseTitle||"")} ${r.session.weekLabel?(" &middot; "+esc(r.session.weekLabel)):""} &middot; ${esc(r.session.level)} &middot; ${r.session.duration} minutes &middot; ${esc(r.session.citationStyle)} citations</p>

      <div id="rtab-content"></div>

        <span class="exlabel">EXPORT:</span>

        <button class="btn btn-secondary" id="btn-handout">Student handout (.doc)</button>
        <button class="btn btn-secondary" id="btn-md">Full package (.md)</button>
        <label style="font-family:var(--mono); font-size:11px; color:var(--muted); display:flex; align-items:center; gap:5px; margin-left:4px;"><input type="checkbox" id="hc-export-toggle"> HC palette</label>
        <button class="btn btn-ghost" id="btn-save-archive">${state.archiveSaveState==='saved' ? 'Saved to archive &#10003;' : (state.archiveSaveState==='saving' ? 'Saving...' : 'Save to Archive')}</button>
        <button class="btn btn-ghost" id="btn-startover">Start a new session &rarr;</button>
      </div>
      <div class="a11y-note">Exported slides use real text (not images) throughout, so they work with screen readers by default; the logo image carries alt text. Use the HC palette checkbox for a high-contrast export suited to projection in bright rooms or for low-vision students.</div>
    </div>
  </div>`);

  const tabWrap = wrap.querySelector('#rtabs');
  tabs.forEach(([key,label])=>{
    const t = el(`<div class="rtab ${key===active?'active':''}">${label}</div>`);
    t.addEventListener('click', ()=>{ state.resultTab=key; render(); });
    tabWrap.appendChild(t);
  });

  const content = wrap.querySelector('#rtab-content');
  if(active==="timeline"){
    content.innerHTML = renderTimeline(r);
  } else if(active==="slides"){
    content.innerHTML = `<div class="toggle-row"><input type="checkbox" id="plain-toggle" ${state.showPlainLanguage?'checked':''}> Show plain-language summaries</div>` +
      (r.recap ? `<div class="slide-card recap-slide"><div class="stitle">Previously: ${esc(r.recap.topic)}</div><ul>${(r.recap.blockTitles||[]).map(t=>`<li>${esc(t)}</li>`).join('')}</ul></div>` : "") +
      r.blocks.map((block,bi)=>`
      <div class="block-section">
        <div class="block-header"><span class="bnum">Block ${bi+1}</span><h3>${esc(block.title)}</h3></div>
        <p class="hint" style="margin-top:-8px;">${esc(block.theme||"")} &middot; ${block.minutes} min</p>
        ${(block.slides||[]).map(sl=>`
          <div class="slide-card">
            ${sl.citation && sl.citation.toLowerCase()!=="null" ? `<span class="citation">${esc(sl.citation)}</span>`:""}
            <div class="stitle">${esc(sl.slide_title||"")}</div>
            <ul>${(sl.bullets||[]).map(b=>`<li>${esc(b)}</li>`).join('')}</ul>
            <div class="notes"><b>Teaching notes</b><br>${esc(sl.speaker_notes||"")}</div>
            ${state.showPlainLanguage && sl.plain_summary ? `<div class="plain-lang-box"><b>Plain-language summary</b>${esc(sl.plain_summary)}</div>` : ""}
          </div>
        `).join('')}

    const pt = content.querySelector('#plain-toggle');
    if(pt) pt.addEventListener('change', (e)=>{ state.showPlainLanguage = e.target.checked; render(); });
  } else if(active==="engagement"){
    content.innerHTML = `
      <div class="activity-card">
        <div class="atitle">${esc(r.engagement.title||"Engagement Activity")}</div>
        <p>${esc(r.engagement.instructions||"")}</p>
        ${r.engagement.materials_needed ? `<p style="font-style:italic; color:#6B4A0F; font-size:13px;">Materials: ${esc(r.engagement.materials_needed)}</p>` : ""}
      </div>
      <h3 style="font-family:var(--serif); color:var(--navy-deep); font-size:20px;">Discussion Questions</h3>
      <ul class="qa-list">${(r.discussionQuestions||[]).map(q=>`<li><span class="qmark">?</span>${esc(q)}</li>`).join('')}</ul>
    `;
  } else if(active==="assessment"){
    content.innerHTML = `
      <div class="slide-card">
        <div class="stitle">In-class formative check</div>
        <p>${esc(r.assessment.formative_check||"")}</p>
      </div>
      <h3 style="font-family:var(--serif); color:var(--navy-deep); font-size:20px;">Assessment Ideas</h3>
      <ul class="qa-list">${(r.assessment.assessment_ideas||[]).map(a=>`<li><span class="qmark">&#10003;</span>${esc(a)}</li>`).join('')}</ul>
      <div class="slide-card" style="margin-top:14px;">
        <div class="stitle">Take-home task</div>
        <p>${esc(r.assessment.take_home_task||"")}</p>
      </div>
      ${renderRubricTable(r.assessment.rubric)}
    `;
  } else if(active==="references"){
    content.innerHTML = `
      <p class="hint">Style: ${esc(r.session.citationStyle)}</p>
      <ul class="ref-list">${(r.references||[]).map(ref=>`<li>${esc(ref)}</li>`).join('')}</ul>
      ${r.references && r.references.length ? `<p class="ref-note">AI-suggested citations, drawn from the uploaded excerpts. Verify author, year, and publisher before distributing to students.</p>` : `<p class="ref-note">No readings were uploaded for this session.</p>`}
    `;
  }

  wrap.querySelector('#btn-pptx').addEventListener('click', async (e)=>{
    const useHC = wrap.querySelector('#hc-export-toggle').checked;
    e.target.disabled = true; e.target.textContent = "Building slides...";
    try{ await exportPPTX(useHC); }catch(err){ alert("Could not build the slide file: "+err.message); }
    e.target.disabled = false; e.target.textContent = "Slides (.pptx)";
  });
  wrap.querySelector('#btn-doc').addEventListener('click', ()=>exportNotes());
  wrap.querySelector('#btn-handout').addEventListener('click', ()=>exportHandout());
  wrap.querySelector('#btn-md').addEventListener('click', ()=>exportMarkdown());
  wrap.querySelector('#btn-save-archive').addEventListener('click', async (e)=>{
    if(state.archiveSaveState==='saved') return;
    state.archiveSaveState = 'saving'; render();
    try{
      await saveCurrentToArchive();
      state.archiveSaveState = 'saved';
      await clearDraftResult();
    }catch(err){
      state.archiveSaveState = 'idle';
      alert(err.message);
    }
    render();
  });
  wrap.querySelector('#btn-startover').addEventListener('click', async ()=>{
    if(confirm("Start a new session? This clears the current uploads and generated content (anything already saved to the archive is kept).")){
      state.step=1; state.syllabus=null; state.publications=[]; state.result=null; state.error=null; state.tasks=[];
      state.recapSessionId=""; state.showPlainLanguage=false; state.clos=""; state.draftDismissed=true;
      await clearDraftResult();
      await clearDraftSession();
      render();
    }
  });

  return wrap;
}

function renderRubricTable(rubric){
  if(!rubric || !rubric.criteria) return "";
  return `<h3 style="font-family:var(--serif); color:var(--navy-deep); font-size:20px; margin-top:20px;">Rubric</h3>
  <table class="rubric-table">
    <tr><th>Criterion</th>${rubric.levels.map(l=>`<th>${esc(l)}</th>`).join('')}</tr>
    ${rubric.criteria.map((c,ci)=>`<tr><td class="crit">${esc(c)}</td>${rubric.levels.map((lv,li)=>`<td>${esc((rubric.cells[ci]&&rubric.cells[ci][li])||"")}</td>`).join('')}</tr>`).join('')}
  </table>`;
}

/* ---------------- global header wiring ---------------- */
document.getElementById('hc-toggle').addEventListener('change', (e)=>{
  document.body.classList.toggle('hc', e.target.checked);
});
document.getElementById('btn-open-archive').addEventListener('click', ()=>{
  state.archiveOpen = true;
  render();
});
/* Full reset: wipes everything this Studio keeps on the device, including the
   saved archive, both autosaved drafts, and the access and subscription grants.
   Export or save anything worth keeping before using it. */
document.getElementById('btn-reset-all').addEventListener('click', async ()=>{
  if(!confirm("Reset everything on this device? The saved session archive, any autosaved draft, and your access and subscription codes will all be cleared. This cannot be undone. Export anything you want to keep first.")) return;
  const idx = state.archiveIndex.length ? state.archiveIndex : await loadArchiveIndexFromStorage();
  for(const entry of idx){
    try{ await appStorage.delete('session:'+entry.id, false); }catch(e){ /* best effort */ }
  }
  for(const key of ['session-index','draft-session','draft-result','access-grant','subscription-grant']){
    try{ await appStorage.delete(key, false); }catch(e){ /* best effort */ }
  }
  location.reload();
});

document.getElementById('btn-logout').addEventListener('click', async ()=>{
  if(!confirm("Log out? Anything you've filled in or generated stays in this browser tab and will still be here when you log back in.")) return;
  try{ await appStorage.delete('access-grant', false); }catch(e){}
  state.accessGranted = false;
  state.gateTab = 'request';
  state.gateSubmitted = false;
  state.gateError = null;
  render();
});

/* ---------------- init ---------------- */
(async function init(){
  try{
  await checkExistingAccess();
  await checkExistingSubscription();
  state.archiveIndex = await loadArchiveIndexFromStorage();
  try{
    const dr = await appStorage.get('draft-result', false);
    if(dr) state.draftResult = JSON.parse(dr.value);
  }catch(e){ /* no draft, or storage unavailable outside claude.ai */ }
  try{
    const ds = await appStorage.get('draft-session', false);
    if(ds) state.draftSession = JSON.parse(ds.value);
  }catch(e){ /* no draft, or storage unavailable outside claude.ai */ }
  render();
  }catch(e){
    // Never leave the app half-painted because a start-up step failed.
    console.error("Start-up error:", e);
    try{ render(); }catch(e2){ console.error("Render failed:", e2); }
  }
})();
</script>
</body>
</html>
