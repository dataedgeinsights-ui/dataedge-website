<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DataEdge Lecture Studio</title>
<script src="../vendor/pdf.min.js" onerror="console.error('Missing ../vendor/pdf.min.js — PDF reading will not work.')"></script>
<script src="../vendor/mammoth.browser.min.js" onerror="console.error('Missing ../vendor/mammoth.browser.min.js — Word reading will not work.')"></script>
<script src="../vendor/pptxgen.bundle.js" onerror="console.error('Missing ../vendor/pptxgen.bundle.js — slide export will not work.')"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap');

:root{
  --navy-deep:#0E1F38;
  --navy:#16324F;
  --navy-soft:#2A4A6E;
  --green-deep:#1F5C38;
  --green:#3E8E5A;
  --green-bright:#6FBE7C;
  --amber:#C98A2B;
  --amber-soft:#F3E3C6;
  --cream:#F7F5EF;
  --paper:#FFFFFF;
  --ink:#1B1F23;
  --muted:#5B6472;
  --border:#E2DED4;
  --danger:#B3432E;
  --serif:'Cormorant Garamond', Georgia, serif;
  --sans:'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  --mono:'DM Mono', 'Courier New', monospace;
}
/* High-contrast override: because everything below is built on these
   variables, flipping them here re-themes the whole app. */
body.hc{
  --navy-deep:#000000; --navy:#000000; --navy-soft:#000000;
  --green-deep:#FFD400; --green:#FFD400; --green-bright:#FFD400;
  --amber:#00E5FF; --amber-soft:#00232B;
  --cream:#000000; --paper:#000000; --ink:#FFFFFF; --muted:#DDDDDD; --border:#FFFFFF;
  background:#000000;
}
body.hc .slide-card, body.hc .card, body.hc .fileitem, body.hc .qa-list li, body.hc .activity-card, body.hc .summary-box{
  background:#000000 !important;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--cream);
  color:var(--ink);
  font-family:var(--sans);
  font-size:15px;
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
::selection{background:var(--green-bright); color:var(--navy-deep);}
:focus-visible{outline:3px solid var(--amber); outline-offset:2px;}

/* ---------- Header ---------- */
.site-header{
  background:var(--navy-deep);
  color:#fff;
  padding:18px 32px;
  display:flex;
  align-items:center;
  gap:16px;
  border-bottom:3px solid var(--green);
}
.site-header img.logo{height:44px; width:auto; display:block; border-radius:4px;}
.brandblock{display:flex; flex-direction:column; line-height:1.15;}
.brandblock .name{font-family:var(--serif); font-weight:700; font-size:20px; letter-spacing:0.02em;}
.brandblock .sub{font-family:var(--mono); font-size:11px; letter-spacing:0.12em; text-transform:uppercase; color:var(--green-bright); margin-top:3px;}
.site-header .tagline{margin-left:auto; font-family:var(--sans); font-size:12.5px; color:#C9D3DE; max-width:280px; text-align:right;}
.header-actions{display:flex; align-items:center; gap:14px; margin-left:18px;}
.hc-toggle{display:flex; align-items:center; gap:6px; font-family:var(--mono); font-size:10.5px; color:#C9D3DE; cursor:pointer; text-transform:uppercase; letter-spacing:0.04em;}
.hc-toggle input{accent-color:var(--green-bright);}
.btn-reset{color:#E8A6A6; border-color:#E8A6A644;}
.btn-reset:hover{background:#B3432E; border-color:#B3432E; color:#fff;}
.terms-row{display:flex;gap:9px;align-items:flex-start;margin:16px 0 4px;cursor:pointer;font-size:12.5px;line-height:1.55;color:var(--ink-soft);}
.terms-row input{margin-top:2px;width:15px;height:15px;accent-color:var(--green-bright);cursor:pointer;flex-shrink:0;}
.terms-row a{color:var(--green-bright);text-decoration:underline;}
.btn-archive{
  font-family:var(--mono); font-size:11px; text-transform:uppercase; letter-spacing:0.05em;
  background:transparent; color:#E4E9EF; border:1px solid rgba(255,255,255,0.3); border-radius:5px;
  padding:8px 12px; cursor:pointer; display:flex; align-items:center; gap:6px;
}
.btn-archive:hover{border-color:var(--green-bright); color:var(--green-bright);}
.btn-archive .cnt{background:var(--green); color:#fff; border-radius:10px; padding:1px 7px; font-size:10px;}

/* ---------- Access gate ---------- */
.gate-wrap{max-width:520px; margin:60px auto; padding:0 20px;}
.gate-card{background:var(--paper); border:1px solid var(--border); border-radius:8px; padding:34px 32px; box-shadow:0 10px 40px rgba(14,31,56,0.08);}
.gate-logo{display:block; height:56px; margin:0 auto 18px auto;}
.gate-card h2{font-family:var(--serif); font-size:26px; color:var(--navy-deep); text-align:center; margin:0 0 4px 0;}
.gate-card .gate-sub{text-align:center; color:var(--muted); font-size:13.5px; margin-bottom:22px;}
.gate-tabs{display:flex; border-bottom:1px solid var(--border); margin-bottom:20px;}
.gate-tab{flex:1; text-align:center; padding:10px; font-family:var(--mono); font-size:11.5px; text-transform:uppercase; letter-spacing:0.05em; color:var(--muted); cursor:pointer; border-bottom:2px solid transparent; margin-bottom:-1px;}
.gate-tab.active{color:var(--navy-deep); border-bottom-color:var(--green);}
.gate-success{text-align:center; padding:20px 10px;}
.gate-success .big-check{font-size:40px; color:var(--green-deep); margin-bottom:10px;}
.gate-footer-note{font-family:var(--mono); font-size:10.5px; color:var(--muted); text-align:center; margin-top:18px; line-height:1.6;}
.pay-instructions{background:#FFF4E5; border:1px solid #E8C48A; border-radius:6px; padding:16px 18px; margin-bottom:20px; font-size:13.5px; line-height:1.6;}
.pay-instructions p{margin:0 0 8px 0;}
.pay-instructions p:last-child{margin-bottom:0;}

/* ---------- Stepper ---------- */
.stepper{
  display:flex;
  max-width:1040px;
  margin:0 auto;
  padding:22px 32px 0 32px;
  gap:6px;
}
.step-pill{
  flex:1;
  display:flex;
  align-items:center;
  gap:10px;
  padding:10px 14px;
  border-radius:8px;
  font-family:var(--mono);
  font-size:12px;
  letter-spacing:0.04em;
  color:var(--muted);
  border:1px solid var(--border);
  background:var(--paper);
  cursor:default;
  transition:all .15s ease;
}
.step-pill .num{
  font-family:var(--mono);
  font-size:12px;
  width:22px;height:22px;
  border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  background:var(--border);
  color:var(--muted);
  flex-shrink:0;
}
.step-pill.active{border-color:var(--green); color:var(--navy-deep); box-shadow:0 1px 0 rgba(0,0,0,0.02);}
.step-pill.active .num{background:var(--green); color:#fff;}
.step-pill.done{color:var(--green-deep); cursor:pointer;}
.step-pill.done .num{background:var(--green-deep); color:#fff;}
.step-pill.done:hover{border-color:var(--green-deep);}

/* ---------- Main ---------- */
main{max-width:1040px; margin:0 auto; padding:28px 32px 80px 32px;}
.card{
  background:var(--paper);
  border:1px solid var(--border);
  border-left:4px solid var(--navy);
  border-radius:6px;
  padding:26px 28px;
  margin-bottom:22px;
}
.card h2{
  font-family:var(--serif);
  font-weight:700;
  font-size:26px;
  margin:0 0 4px 0;
  color:var(--navy-deep);
}
.card .hint{color:var(--muted); font-size:13.5px; margin:0 0 18px 0;}
.card .subhead{font-family:var(--mono); font-size:11px; text-transform:uppercase; letter-spacing:0.08em; color:var(--green-deep); margin:22px 0 4px 0; border-top:1px solid var(--border); padding-top:16px;}
.card .subhead:first-of-type{border-top:none; padding-top:0; margin-top:0;}
label{display:block; font-family:var(--mono); font-size:11px; text-transform:uppercase; letter-spacing:0.06em; color:var(--navy); margin-bottom:6px; margin-top:16px;}
label:first-of-type{margin-top:0;}
input[type=text], input[type=number], select, textarea{
  width:100%;
  padding:10px 12px;
  border:1px solid var(--border);
  border-radius:5px;
  font-family:var(--sans);
  font-size:14.5px;
  background:#FDFCFA;
  color:var(--ink);
}
textarea{resize:vertical; min-height:70px; font-family:var(--mono); font-size:13px;}
input:focus, select:focus, textarea:focus{outline:2px solid var(--green-bright); outline-offset:1px; border-color:var(--green);}
.row{display:grid; grid-template-columns:1fr 1fr; gap:18px;}
.row3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:18px;}
.fieldnote{font-family:var(--mono); font-size:10.5px; color:var(--muted); margin-top:4px;}

.dropzone{
  border:1.5px dashed var(--border);
  border-radius:6px;
  padding:26px;
  text-align:center;
  color:var(--muted);
  cursor:pointer;
  background:#FCFBF8;
  transition:border-color .15s, background .15s;
}
.dropzone:hover, .dropzone.drag{border-color:var(--green); background:var(--amber-soft);}
.dropzone .big{font-family:var(--serif); font-size:18px; color:var(--navy-deep); display:block; margin-bottom:4px;}
.dropzone .small{font-family:var(--mono); font-size:11.5px;}

.linkrow{display:flex; gap:8px; margin-top:10px;}
.linkrow input{flex:1;}
.filelist{margin-top:16px; display:flex; flex-direction:column; gap:8px;}
.fileitem{
  display:flex; align-items:center; gap:10px;
  border:1px solid var(--border); border-radius:5px;
  padding:9px 12px; background:#FCFBF8;
}
.fileitem .ficon{font-family:var(--mono); font-size:10px; background:var(--navy); color:#fff; padding:3px 6px; border-radius:3px; text-transform:uppercase;}
.fileitem .finame{flex:1; font-size:13.5px; font-weight:500;}
.fileitem .fimeta{font-family:var(--mono); font-size:11px; color:var(--muted);}
.fileitem .firemove{cursor:pointer; color:var(--danger); font-size:13px; font-family:var(--mono); background:none; border:none;}
.fileitem.warn{border-color:var(--amber);}
.fileitem .fiwarn{font-family:var(--mono); font-size:10.5px; color:var(--amber); }

.btn{
  font-family:var(--sans); font-weight:600; font-size:14px;
  padding:11px 22px; border-radius:5px; border:none; cursor:pointer;
  display:inline-flex; align-items:center; gap:8px;
  transition:transform .1s ease, box-shadow .15s ease;
}
.btn:active{transform:translateY(1px);}
.btn-primary{background:var(--green-deep); color:#fff;}
.btn-primary:hover{background:var(--green);}
.btn-secondary{background:var(--paper); color:var(--navy-deep); border:1px solid var(--border);}
.btn-secondary:hover{border-color:var(--navy);}
.btn-ghost{background:transparent; color:var(--navy); border:1px solid transparent; padding:8px 12px; font-size:13px;}
.btn-ghost:hover{background:var(--amber-soft);}
.btn:disabled{opacity:0.45; cursor:not-allowed;}
.btnrow{display:flex; gap:10px; margin-top:22px; flex-wrap:wrap; align-items:center;}

.errbox{background:#FBEAE6; border:1px solid var(--danger); color:#7A2D1D; padding:12px 14px; border-radius:5px; font-size:13.5px; margin-top:14px;}
.warnbox{background:var(--amber-soft); border:1px solid var(--amber); color:#6B4A0F; padding:10px 14px; border-radius:5px; font-size:13px; margin-top:14px;}
.infobox{background:#EAF1F8; border:1px solid var(--navy-soft); color:var(--navy-deep); padding:10px 14px; border-radius:5px; font-size:13px; margin-top:14px;}

/* ---------- Review summary ---------- */
.summary-grid{display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-top:6px;}
.summary-box{border:1px solid var(--border); border-radius:5px; padding:14px 16px; background:#FCFBF8;}
.summary-box .label{font-family:var(--mono); font-size:10.5px; text-transform:uppercase; letter-spacing:0.06em; color:var(--muted);}
.summary-box .value{font-family:var(--serif); font-size:19px; color:var(--navy-deep); font-weight:600; margin-top:3px;}

/* ---------- Loading ---------- */
.loading-panel{text-align:center; padding:50px 20px;}
.spinner{width:38px;height:38px;border:3px solid var(--border); border-top-color:var(--green); border-radius:50%; margin:0 auto 18px auto; animation:spin 0.9s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.loading-panel .stage{font-family:var(--mono); font-size:12.5px; color:var(--navy); letter-spacing:0.03em;}
.loading-panel .stagelist{margin-top:18px; text-align:left; max-width:380px; margin-left:auto; margin-right:auto; font-size:12.5px; font-family:var(--mono); color:var(--muted);}
.loading-panel .stagelist div{padding:3px 0;}
.loading-panel .stagelist div.done{color:var(--green-deep);}
.loading-panel .stagelist div.active{color:var(--navy-deep); font-weight:600;}
.loading-panel .stagelist div.error{color:var(--amber);}

/* ---------- Results ---------- */
.resulttabs{display:flex; gap:4px; flex-wrap:wrap; border-bottom:2px solid var(--border); margin-bottom:22px;}
.rtab{
  font-family:var(--mono); font-size:11.5px; text-transform:uppercase; letter-spacing:0.05em;
  padding:10px 16px; cursor:pointer; color:var(--muted); border-bottom:2px solid transparent; margin-bottom:-2px;
}
.rtab.active{color:var(--navy-deep); border-bottom-color:var(--green);}
.rtab:hover{color:var(--navy-deep);}

/* timeline (signature element) */
.timeline-wrap{background:var(--navy-deep); border-radius:8px; padding:22px 22px 16px 22px; margin-bottom:24px;}
.timeline-title{font-family:var(--mono); font-size:11px; text-transform:uppercase; letter-spacing:0.1em; color:var(--green-bright); margin-bottom:14px;}
.timeline-bar{display:flex; height:34px; border-radius:4px; overflow:hidden; border:1px solid rgba(255,255,255,0.15);}
.tseg{display:flex; align-items:center; justify-content:center; font-family:var(--mono); font-size:10.5px; color:#fff; overflow:hidden; white-space:nowrap; padding:0 4px; border-right:1px solid rgba(255,255,255,0.18);}
.tseg:last-child{border-right:none;}
.timeline-legend{display:flex; gap:18px; margin-top:12px; flex-wrap:wrap;}
.tleg{display:flex; align-items:center; gap:6px; font-family:var(--mono); font-size:10.5px; color:#C9D3DE;}
.tleg .sw{width:10px;height:10px;border-radius:2px;}
.timeline-blocks{margin-top:16px; display:flex; flex-direction:column; gap:6px;}
.tblock-row{display:flex; justify-content:space-between; font-family:var(--sans); font-size:13px; color:#E4E9EF; padding:6px 0; border-top:1px solid rgba(255,255,255,0.08);}
.tblock-row .t-name{font-weight:600;}
.tblock-row .t-min{font-family:var(--mono); font-size:11.5px; color:var(--green-bright);}
.recap-banner{background:var(--amber-soft); border:1px solid var(--amber); border-radius:6px; padding:10px 14px; margin-bottom:18px; font-size:13px; color:#6B4A0F;}

/* objectives */
.objectives-list{list-style:none; padding:0; margin:0;}
.objectives-list li{
  display:flex; gap:12px; padding:12px 0; border-bottom:1px solid var(--border); font-size:14.5px; align-items:flex-start;
}
.objectives-list li .onum{font-family:var(--mono); color:var(--green-deep); font-weight:600; flex-shrink:0;}
.obj-tags{display:flex; gap:6px; margin-top:6px; flex-wrap:wrap;}
.bloom-badge{font-family:var(--mono); font-size:9.5px; text-transform:uppercase; letter-spacing:0.05em; padding:2px 8px; border-radius:10px; color:#fff;}
.clo-tag{font-family:var(--mono); font-size:9.5px; padding:2px 8px; border-radius:10px; background:var(--border); color:var(--navy-deep);}

/* slide blocks */
.block-section{margin-bottom:30px;}
.block-header{display:flex; align-items:baseline; gap:10px; margin-bottom:14px;}
.block-header .bnum{font-family:var(--mono); background:var(--navy); color:#fff; padding:4px 9px; border-radius:4px; font-size:12px;}
.block-header h3{font-family:var(--serif); font-size:22px; margin:0; color:var(--navy-deep);}
.slide-card{
  border:1px solid var(--border); border-left:3px solid var(--green); border-radius:6px;
  padding:16px 18px; margin-bottom:12px; background:#FEFEFD;
}
.slide-card.recap-slide{border-left-color:var(--amber); background:var(--amber-soft);}
.slide-card .stitle{font-family:var(--serif); font-weight:700; font-size:17px; color:var(--navy-deep); margin-bottom:8px;}
.slide-card ul{margin:0 0 10px 0; padding-left:20px;}
.slide-card ul li{font-size:14px; margin-bottom:4px;}
.slide-card .citation{display:inline-block; font-family:var(--mono); font-size:11px; color:var(--amber); background:var(--amber-soft); padding:2px 8px; border-radius:3px; margin-bottom:8px;}
.slide-card .notes{
  font-size:13px; color:var(--muted); border-top:1px dashed var(--border); padding-top:8px; margin-top:6px;
  font-style:italic;
}
.slide-card .notes b{color:var(--navy); font-style:normal; font-family:var(--mono); font-size:10.5px; text-transform:uppercase; letter-spacing:0.04em;}
.plain-lang-box{background:#EAF1F8; border:1px solid var(--navy-soft); border-radius:5px; padding:8px 12px; margin-top:8px; font-size:13px; color:var(--navy-deep);}
.plain-lang-box b{font-family:var(--mono); font-size:10px; text-transform:uppercase; letter-spacing:0.04em; display:block; margin-bottom:3px; color:var(--navy);}
.toggle-row{display:flex; align-items:center; gap:8px; margin-bottom:16px; font-family:var(--mono); font-size:11.5px; color:var(--navy); text-transform:uppercase; letter-spacing:0.04em;}
.toggle-row input{accent-color:var(--green);}

/* discussion / assessment */
.qa-list{list-style:none; padding:0; margin:0;}
.qa-list li{
  padding:12px 14px; margin-bottom:8px; background:#FCFBF8; border:1px solid var(--border);
  border-radius:5px; font-size:14.5px; display:flex; gap:10px;
}
.qa-list li .qmark{font-family:var(--serif); font-size:20px; color:var(--green-deep); font-weight:700; flex-shrink:0; line-height:1;}
.activity-card{background:var(--amber-soft); border:1px solid var(--amber); border-radius:6px; padding:16px 18px; margin-bottom:16px;}
.activity-card .atitle{font-family:var(--serif); font-weight:700; font-size:17px; color:#6B4A0F; margin-bottom:6px;}

.rubric-table{width:100%; border-collapse:collapse; margin:14px 0 4px 0; font-size:13px;}
.rubric-table th, .rubric-table td{border:1px solid var(--border); padding:9px 10px; text-align:left; vertical-align:top;}
.rubric-table th{background:var(--navy-deep); color:#fff; font-family:var(--mono); font-size:11px; text-transform:uppercase; letter-spacing:0.03em;}
.rubric-table td.crit{font-weight:600; background:#FCFBF8; font-family:var(--serif); font-size:14.5px;}

/* references */
.ref-list{padding-left:0; list-style:none;}
.ref-list li{font-size:13.5px; padding:8px 0; border-bottom:1px solid var(--border); color:var(--ink);}
.ref-note{font-family:var(--mono); font-size:11px; color:var(--muted); margin-top:10px;}

/* export bar */
.exportbar{
  position:sticky; bottom:0; background:var(--paper); border-top:1px solid var(--border);
  padding:16px 0; margin-top:10px; display:flex; gap:10px; flex-wrap:wrap; align-items:center;
}
.exportbar .exlabel{font-family:var(--mono); font-size:11px; color:var(--muted); margin-right:6px;}
.a11y-note{font-family:var(--mono); font-size:10.5px; color:var(--muted); margin-top:10px;}

/* archive overlay */
.archive-overlay{
  position:fixed; inset:0; background:rgba(14,31,56,0.55); z-index:50;
  display:flex; align-items:flex-start; justify-content:center; padding:60px 20px;
}
.archive-overlay.hidden{display:none;}
.archive-panel{
  background:var(--paper); border-radius:8px; max-width:720px; width:100%; max-height:80vh; overflow-y:auto;
  padding:26px 28px; box-shadow:0 20px 50px rgba(0,0,0,0.3);
}
.archive-panel h2{font-family:var(--serif); color:var(--navy-deep); margin:0 0 4px 0;}
.archive-close{float:right; background:none; border:none; font-size:20px; cursor:pointer; color:var(--muted);}
.archive-row{
  display:flex; align-items:center; gap:12px; border:1px solid var(--border); border-radius:6px;
  padding:12px 14px; margin-bottom:10px; background:#FCFBF8;
}
.archive-row .ainfo{flex:1;}
.archive-row .atitle2{font-family:var(--serif); font-weight:600; font-size:15.5px; color:var(--navy-deep);}
.archive-row .ameta{font-family:var(--mono); font-size:10.5px; color:var(--muted); margin-top:2px;}
.archive-row .aclos{margin-top:5px; display:flex; gap:4px; flex-wrap:wrap;}
.archive-actions{display:flex; gap:6px; flex-shrink:0;}
.archive-actions button{font-family:var(--mono); font-size:10.5px; padding:6px 10px; border-radius:4px; border:1px solid var(--border); background:#fff; cursor:pointer;}
.archive-actions button.primary{background:var(--green-deep); color:#fff; border-color:var(--green-deep);}
.archive-actions button.danger{color:var(--danger); border-color:var(--danger);}
.archive-empty{color:var(--muted); font-size:13.5px; text-align:center; padding:30px 10px;}

/* footer */
.site-footer{
  text-align:center; padding:26px 20px 40px 20px; font-family:var(--mono); font-size:11px; color:var(--muted);
  border-top:1px solid var(--border); margin-top:10px;
}
.site-footer span{color:var(--green-deep);}

@media (max-width:720px){

/* The codes above are stored as SHA-256 hashes, not plain text, so anyone
   viewing this page's source sees a scrambled string, not the actual code.
   This is NOT the same as real server-side authentication (a determined,
   technical person could still work around a client-side check), but it
   stops the code from being plainly readable in "View Source" or dev tools,
   which was the specific concern this addresses.
   To add or change a code: ask Claude to generate a new SHA-256 hash for
   your chosen word/phrase, and paste the resulting hash into this array
   (you can list several). Do not paste the plain code here. */
async function sha256(str){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

/* ---------------- portable storage layer ----------------
   window.storage (Claude.ai's artifact persistence API) only exists
   when this tool is opened inside Claude.ai. When it's hosted on a
   regular website, there is no such API, so this falls back to the
   browser's own localStorage, which persists per browser/device on
   your domain. Every other function in this file talks to
   `appStorage`, never to window.storage directly, so the app works
   the same way in both contexts. */
const hasNativeStorage = (typeof window.storage !== 'undefined') && window.storage && typeof window.storage.get === 'function';
const appStorage = hasNativeStorage ? window.storage : {
  get: async (key, shared) => {
    const k = 'des_' + (shared ? 'shared:' : 'user:') + key;
    const v = localStorage.getItem(k);
    return v !== null ? {key, value: v, shared} : null;
  },
  set: async (key, value, shared) => {
    const k = 'des_' + (shared ? 'shared:' : 'user:') + key;
    localStorage.setItem(k, value);
    return {key, value, shared};
  },
  delete: async (key, shared) => {
    const k = 'des_' + (shared ? 'shared:' : 'user:') + key;
    localStorage.removeItem(k);
    return {key, deleted: true, shared};
  },
  list: async (prefix, shared) => {
    const p = 'des_' + (shared ? 'shared:' : 'user:') + (prefix || '');
    return {keys: Object.keys(localStorage).filter(k => k.startsWith(p)).map(k => k.slice(4))};
  }
};

function timeAgo(iso){
  if(!iso) return "recently";
  const diffMs = Date.now() - new Date(iso).getTime();
  const mins = Math.floor(diffMs/60000);
  if(mins < 1) return "moments ago";
  if(mins < 60) return mins+" minute"+(mins===1?"":"s")+" ago";
  const hrs = Math.floor(mins/60);
  if(hrs < 24) return hrs+" hour"+(hrs===1?"":"s")+" ago";
  const days = Math.floor(hrs/24);
  return days+" day"+(days===1?"":"s")+" ago";
}

async function parseArrayBufferByExt(buf, ext){
  if(ext === 'pdf'){
    pdfjsLib.GlobalWorkerOptions.workerSrc = "../vendor/pdf.worker.min.js";
    const pdf = await pdfjsLib.getDocument({data: buf}).promise;
    let text = "";
    const maxPages = Math.min(pdf.numPages, 40);
    for(let i=1;i<=maxPages;i++){
      const page = await pdf.getPage(i);
      const content = await page.getTextContent();
      text += content.items.map(it=>it.str).join(' ') + "\n";
    }
    return {text, warn: pdf.numPages > maxPages ? `Only first ${maxPages} of ${pdf.numPages} pages read` : null};
  }
  if(ext === 'docx'){
    const res = await mammoth.extractRawText({arrayBuffer: buf});
    return {text: res.value, warn: null};
  }
  if(ext === 'doc'){
    return {text: "", warn: "Old .doc format could not be read. Please re-save as .docx and try again."};
  }
  if(['txt','md','csv'].includes(ext)){
    return {text: new TextDecoder('utf-8').decode(buf), warn: null};
  }
  try{
    const guess = new TextDecoder('utf-8').decode(buf).slice(0,50);
    if(/^[\x09\x0A\x0D\x20-\x7E]*$/.test(guess)){
      return {text: new TextDecoder('utf-8').decode(buf), warn: "File type wasn't recognized; read as plain text, which may be inaccurate."};
    }
  }catch(e){}
  return {text: "", warn: "Unsupported or unreadable file type ("+ext+")."};
}

async function extractFromFile(file){
  const ext = file.name.split('.').pop().toLowerCase();
  const buf = await file.arrayBuffer();
  return parseArrayBufferByExt(buf, ext);
}

/* ---- fetching a document from a pasted link ----
   A browser may only fetch a document from another site when that site
   permits it. Many academic hosts, publishers and Google's export URLs do
   not, so a pasted link will often fail. It fails with a clear message
   telling the user to upload the file instead.

   A public relay service was previously used to work around this. It has
   been removed deliberately: the document passed through a third party's
   server, which is not acceptable for course material or programme
   documents held under a confidentiality condition. Uploading a file keeps
   it entirely inside the browser. */
function normalizeSourceUrl(raw){
  let url = raw.trim();
  let gdriveFile = url.match(/drive\.google\.com\/file\/d\/([^/]+)/);
  if(gdriveFile){ return {url:`https://drive.google.com/uc?export=download&id=${gdriveFile[1]}`, label:"Google Drive file"}; }
  let gdriveOpen = url.match(/drive\.google\.com\/open\?id=([^&]+)/);
  if(gdriveOpen){ return {url:`https://drive.google.com/uc?export=download&id=${gdriveOpen[1]}`, label:"Google Drive file"}; }
  let gdocs = url.match(/docs\.google\.com\/document\/d\/([^/]+)/);
  if(gdocs){ return {url:`https://docs.google.com/document/d/${gdocs[1]}/export?format=docx`, label:"Google Doc (exported as .docx)"}; }
  return {url, label:null};
}
function guessExtFromUrlOrType(url, ctype){
  const path = url.split('?')[0].toLowerCase();
  for(const e of ['pdf','docx','doc','txt','md']){ if(path.endsWith('.'+e)) return e; }
  if(ctype){
    if(ctype.includes('pdf')) return 'pdf';
    if(ctype.includes('wordprocessingml')) return 'docx';
    if(ctype.includes('msword')) return 'doc';
    if(ctype.includes('text/plain')) return 'txt';
  }
  return 'pdf';
}
async function fetchDocFromUrl(rawUrl){
  const {url, label} = normalizeSourceUrl(rawUrl);
  let resp = null;
  try{
    resp = await fetch(url, {mode:'cors'});
    if(!resp.ok) throw new Error('HTTP '+resp.status);
  }catch(directErr){
    {
      throw new Error("That link could not be read directly by your browser, which is normal: most sites, including Google Docs and Drive, do not allow it. Download the file and use Upload instead, which also keeps the document on your own device.");
    }
  }
  const buf = await resp.arrayBuffer();
  const ctype = resp.headers.get('content-type') || '';
  const ext = guessExtFromUrlOrType(url, ctype);
  const parsed = await parseArrayBufferByExt(buf, ext);
  let warn = parsed.warn;
  return {text: parsed.text, ext, warn, label};
}

function buildCorpus(pubs, maxPerDoc, maxDocs){
  const used = pubs.filter(p=>p.text && p.text.trim().length>0).slice(0, maxDocs);
  return used.map(p => `--- SOURCE: ${p.name} ---\n${p.text.slice(0, maxPerDoc)}`).join('\n\n');
}

async function callClaude(prompt, timeoutMs){
  timeoutMs = timeoutMs || 60000;
  const controller = new AbortController();
  const timer = setTimeout(()=>controller.abort(), timeoutMs);
  let resp;
  try{
    resp = await fetch(API_URL, {
      method: "POST",
      headers: aiHeaders(),
      body: JSON.stringify({ prompt }),
      signal: controller.signal
    });
  }catch(e){
    if(e.name === 'AbortError'){ throw new Error("This step took longer than "+(timeoutMs/1000)+"s and was stopped. You can try again."); }
    throw new Error("Could not reach "+API_URL+". If this tool is hosted outside Claude.ai, make sure api/generate.js is deployed and ANTHROPIC_API_KEY is set in your Vercel project.");
  }finally{
    clearTimeout(timer);
  }
  let data;
  try{ data = await resp.json(); }catch(e){ throw new Error("The server returned an unreadable response (status "+resp.status+")."); }
  if(!resp.ok){
    const serverMsg = data && data.error ? (typeof data.error === 'string' ? data.error : (data.error.message || JSON.stringify(data.error))) : null;
    throw new Error(serverMsg || ("API request failed ("+resp.status+")"));
  }
  const textBlocks = (data.content||[]).filter(b=>b.type==="text").map(b=>b.text).join("\n");
  let cleaned = textBlocks.trim().replace(/^```json/i,'').replace(/^```/,'').replace(/```$/,'').trim();
  const firstBrace = cleaned.indexOf('{');
  const lastBrace = cleaned.lastIndexOf('}');
  if(firstBrace >= 0 && lastBrace > firstBrace){ cleaned = cleaned.slice(firstBrace, lastBrace+1); }
  try{
    return JSON.parse(cleaned);
  }catch(e){
    throw new Error("Could not parse model output as JSON.");
  }
}

/* ---------------- loading progress: task tracker ----------------
   Independent generation calls run in parallel (see generatePackage),
   so progress is tracked as a set of tasks that move from pending to
   done/error individually, rather than a single sequential log. */
function setPhase(msg){ state.loadingStage = msg; render(); }
function addTask(id, label){ state.tasks.push({id, label, status:'pending'}); }
function markTaskDone(id){ const t=state.tasks.find(x=>x.id===id); if(t) t.status='done'; render(); }
function markTaskError(id, msg){ const t=state.tasks.find(x=>x.id===id); if(t){ t.status='error'; t.error=msg; } render(); }

/* ---------------- timeline planning (client-side, deterministic) ---------------- */
function planTimeline(duration, emphasis){
  const segments = [];
  const openMin = duration >= 90 ? 10 : 5;
  const closeMin = duration >= 90 ? 15 : 8;
  const numBreaks = Math.max(1, Math.floor(duration/90));
  const breakMin = 10;
  const breaksTotal = numBreaks*breakMin;
  let pool = duration - openMin - closeMin - breaksTotal;
  if(pool < 40) pool = Math.max(30, duration - openMin - closeMin);

  const ratios = {"lecture-heavy":[0.80,0.20], "balanced":[0.65,0.35], "discussion-heavy":[0.50,0.50]}[emphasis] || [0.65,0.35];
  const contentPool = Math.round(pool*ratios[0]);
  const engagePool = pool - contentPool;

  const numBlocks = Math.min(5, Math.max(2, Math.round(duration/60)));
  const perBlock = Math.round(contentPool/numBlocks);

  const activityMin = Math.round(engagePool*0.55);
  const discussionMin = engagePool - activityMin;

  segments.push({type:"objectives", title:"Welcome & Learning Objectives", minutes: openMin});
  let placedBreaks = 0;
  for(let i=0;i<numBlocks;i++){
    segments.push({type:"content", title:`Content Block ${i+1}`, minutes: perBlock, blockIndex: i});
    if(placedBreaks < numBreaks && i < numBlocks-1 && (i+1)%Math.ceil(numBlocks/(numBreaks+1))===0){
      segments.push({type:"break", title:"Break", minutes: breakMin});
      placedBreaks++;
    }
  }
  while(placedBreaks < numBreaks){
    segments.splice(segments.length-1, 0, {type:"break", title:"Break", minutes: breakMin});
    placedBreaks++;
  }
  segments.push({type:"activity", title:"Engagement Activity", minutes: activityMin});
  segments.push({type:"discussion", title:"Discussion", minutes: discussionMin});
  segments.push({type:"assessment", title:"Wrap-up & Assessment", minutes: closeMin});
  return segments;
}

const SEG_COLORS = {
  objectives: "#2A4A6E", content: "#3E8E5A", break: "#4A5560",
  activity: "#C98A2B", discussion: "#6FBE7C", assessment: "#0E1F38"
};

/* ---------------- generation pipeline ---------------- */
async function generatePackage(){
  state.error = null;
  state.tasks = [];
  state.result = null;
  state.archiveSaveState = "idle";
  render();

  try{
    const corpus = buildCorpus(state.publications, 3000, 8);
    const syllabusExcerpt = state.syllabus ? state.syllabus.text.slice(0,4000) : "";
    const s = state.session;
    const segments = planTimeline(s.duration, s.emphasis);
    const contentBlocks = segments.filter(seg=>seg.type==="content");
    const closArray = (state.clos||"").split("\n").map(x=>x.trim()).filter(Boolean);

    let recapContext = null;
    if(state.recapSessionId){
      setPhase("Loading the previous session for continuity...");
      const prev = await loadSessionFromStorage(state.recapSessionId);
      if(prev){
        recapContext = {
          topic: prev.session.sessionTopic || prev.session.weekLabel || "the previous session",
          objectives: (prev.objectives||[]).map(objText),
          blockTitles: (prev.blocks||[]).map(b=>b.title)
        };
      }
    }

    // --- Step 1 of 2: a single call to establish objectives and a table of contents ---
    setPhase("Step 1 of 2: building the session plan...");
    addTask('plan', 'Reading materials and drafting objectives + outline');
    render();
    const planPrompt = `You are an expert instructional designer supporting a university lecturer preparing a ${s.duration}-minute graduate seminar (${s.level}).
Course: ${s.courseTitle || "Not specified"}
Week / session label: ${s.weekLabel || "Not specified"}
Session topic: ${s.sessionTopic || "Not specified"}
Teaching emphasis: ${s.emphasis}

Course Learning Outcomes (CLOs), if provided, use their exact labels (e.g. "CLO1") when mapping objectives; if none are given, leave clo_refs empty:
${closArray.length ? closArray.join("\n") : "None provided."}

${recapContext ? `This session follows a previous one titled "${recapContext.topic}", which covered: ${recapContext.blockTitles.join(", ")}. Design this session's content blocks to build on that explicitly, without repeating it.` : ""}

SYLLABUS EXCERPT (may be partial):
${syllabusExcerpt || "None provided."}

UPLOADED READINGS (excerpts):
${corpus || "None provided."}

There will be exactly ${contentBlocks.length} content blocks in this session. Design a short table of contents for them.
Respond with STRICT JSON ONLY, no markdown fences, matching exactly this shape:
{"learning_objectives": [{"text":"...", "bloom_level":"Remember|Understand|Apply|Analyze|Evaluate|Create", "clo_refs":["CLO1"]}], "content_blocks": [{"title":"...", "key_theme":"...", "primary_sources":["filename or short label"]}]}
Keep learning_objectives to 4-5 items, each one sentence, doctoral-appropriate. Choose bloom_level honestly based on the verb used (do not default to "Understand"). content_blocks array must have exactly ${contentBlocks.length} items, sequenced so each builds on the last without repeating material.`;
    const plan = await callClaude(planPrompt);
    markTaskDone('plan');
    const blockPlans = (plan.content_blocks || []).slice(0, contentBlocks.length);
    while(blockPlans.length < contentBlocks.length){ blockPlans.push({title:`Content Block ${blockPlans.length+1}`, key_theme:"", primary_sources:[]}); }

    // --- Step 2 of 2: everything else runs at once, since none of these depend on each other ---
    setPhase("Step 2 of 2: drafting slides, engagement, assessment, and references in parallel...");
    const activitySeg = segments.find(x=>x.type==="activity");
    const discSeg = segments.find(x=>x.type==="discussion");

    contentBlocks.forEach((cb,i)=> addTask('block'+i, `Slides for Block ${i+1}: ${blockPlans[i].title}`));
    addTask('engage', 'Engagement activity & discussion questions');
    addTask('assess', 'Assessment ideas & rubric');
    if(state.publications.length > 0) addTask('refs', 'Reference list');
    render();

    const blockJobs = contentBlocks.map((cb,i)=>{
      const bp = blockPlans[i];
      const slidePrompt = `You are drafting lecture slides for graduate students (${s.level}) on the topic below, as part ${i+1} of ${contentBlocks.length} of a ${s.duration}-minute session titled "${s.sessionTopic || s.weekLabel || 'the session'}".

This block's focus: ${bp.title} - ${bp.key_theme || ""}
Allotted time: approximately ${contentBlocks[i].minutes} minutes.
Citation style: ${s.citationStyle} (use a short in-text parenthetical author-date form regardless of style).

SOURCE EXCERPTS TO DRAW ON (cite by author/year if identifiable from the text, otherwise by short source label):
${corpus || "None provided; draw on general disciplinary knowledge and say so implicitly by omitting a citation field."}

Produce 3 to 4 slides for this block only, each with 3 to 4 bullets. Each slide needs a short teaching cue in its notes (a concrete instruction for the lecturer, e.g. what to ask, demonstrate, or pause for) and a one-sentence plain-language summary suitable for a student handout (avoid jargon, avoid rephrasing as a question).
Respond with STRICT JSON ONLY, no markdown fences, matching exactly:
{"slides": [{"slide_title":"...", "bullets":["...", "..."], "speaker_notes":"2-3 sentences including at least one teaching cue starting with 'Cue:'", "citation":"(Author, Year) or null", "plain_summary":"one simple sentence"}]}`;
      return callClaude(slidePrompt)
        .then(r=>{ markTaskDone('block'+i); return {title: bp.title, theme: bp.key_theme, minutes: contentBlocks[i].minutes, slides: r.slides || []}; })
        .catch(e=>{ markTaskError('block'+i, e.message); return {title: bp.title, theme: bp.key_theme, minutes: contentBlocks[i].minutes, slides: [], error: e.message}; });
    });

    const engagePrompt = `Design the participatory portion of a ${s.duration}-minute graduate seminar (${s.level}) on "${s.sessionTopic || s.weekLabel || 'this topic'}", following these planned content blocks: ${blockPlans.map(b=>b.title+": "+b.key_theme).join(" | ")}

There is an engagement activity of about ${activitySeg ? activitySeg.minutes : 20} minutes and a discussion segment of about ${discSeg ? discSeg.minutes : 15} minutes.
Respond with STRICT JSON ONLY, no markdown fences, matching exactly:
{"engagement_activity": {"title":"...", "instructions":"3-4 sentences describing a concrete in-class activity appropriate for graduate students", "materials_needed":"..."}, "discussion_questions": ["...", "...", "...", "...", "..."]}
Discussion questions should be open-ended, analytical, and reference the session's content specifically (5 to 7 questions).`;
    const engageJob = callClaude(engagePrompt)
      .then(r=>{ markTaskDone('engage'); return r; })
      .catch(e=>{ markTaskError('engage', e.message); return {engagement_activity:{}, discussion_questions:[]}; });

    const assessPrompt = `Design a brief formative assessment closing, plus a compact grading rubric, for a ${s.duration}-minute graduate seminar (${s.level}) on "${s.sessionTopic || s.weekLabel || 'this topic'}", covering: ${blockPlans.map(b=>b.title).join(", ")}.
Respond with STRICT JSON ONLY, no markdown fences, matching exactly:
{"formative_check":"one in-class technique to gauge understanding before students leave, one sentence", "assessment_ideas": ["...", "..."], "take_home_task":"one short task connecting to the next session, one to two sentences", "rubric": {"criteria": ["...","...","..."], "levels": ["Exemplary","Proficient","Developing"], "cells": [["...","...","..."],["...","...","..."],["...","...","..."]]}}
Keep assessment_ideas to exactly 2 items. Rubric must have exactly 3 criteria and exactly 3 levels (Exemplary, Proficient, Developing). Each rubric cell is a short phrase under 10 words describing performance at that level for that criterion. Base the criteria on the take-home task or assessment ideas above.`;
    const assessJob = callClaude(assessPrompt)
      .then(r=>{ markTaskDone('assess'); return r; })
      .catch(e=>{ markTaskError('assess', e.message); return {formative_check:'', assessment_ideas:[], take_home_task:'', rubric:null}; });

    let refsJob = Promise.resolve({references: []});
    if(state.publications.length > 0){
      const refPrompt = `Based on these excerpts (which may include title, author, and year on the first page of each source), produce a best-effort reference list in ${s.citationStyle} style. If author or year cannot be determined from the text, use the filename as a placeholder and flag it with "[verify citation]".
${buildCorpus(state.publications, 1200, 10)}
Respond with STRICT JSON ONLY, no markdown fences, matching exactly:
{"references": ["Formatted reference in ${s.citationStyle} style", "..."]}`;
      refsJob = callClaude(refPrompt)
        .then(r=>{ markTaskDone('refs'); return r; })
        .catch(e=>{ markTaskError('refs', e.message); return {references: state.publications.map(p=>p.name+" [verify citation - could not auto-generate]")}; });
    }

    const [allBlockSlides, engageResult, assessResult, refsResult] = await Promise.all([
      Promise.all(blockJobs), engageJob, assessJob, refsJob
    ]);

    state.result = {
      generatedAt: new Date().toISOString(),
      session: {...s, closUsed: closArray},
      segments,
      objectives: plan.learning_objectives || [],
      blocks: allBlockSlides,
      engagement: engageResult.engagement_activity || {},
      discussionQuestions: engageResult.discussion_questions || [],
      assessment: assessResult,
      references: refsResult.references || [],
      recap: recapContext
    };
    state.step = 4;
    state.resultTab = "timeline";
    render();
    saveDraftResult();
    clearDraftSession();
  }catch(err){
    state.error = err.message || String(err);
    render();
  }
}

  s5.addText("Discussion Questions", {x:0.6,y:0.4,w:12,h:0.7,fontSize:26,bold:true,color:NAVY==="000000"?"FFFFFF":NAVY, fontFace:"Georgia"});
  s5.addText((r.discussionQuestions||[]).map(q=>({text:q, options:{bullet:true, breakLine:true, fontSize:15, color:TXT}})), {x:0.7,y:1.2,w:11.9,h:5.5});
  footer(s5, "Discussion");

  let s6 = pptx.addSlide(); if(useHC) s6.background={color:"000000"};
  s6.addText("Wrap-up & Assessment", {x:0.6,y:0.4,w:12,h:0.7,fontSize:26,bold:true,color:NAVY==="000000"?"FFFFFF":NAVY, fontFace:"Georgia"});

  s6.addText((r.assessment.assessment_ideas||[]).map(a=>({text:a, options:{bullet:true, breakLine:true, fontSize:15, color:TXT}})), {x:0.6,y:2.1,w:11.9,h:1.3});
  s6.addText("Take-home: "+(r.assessment.take_home_task||""), {x:0.6,y:3.5,w:11.9,h:0.6,fontSize:14,italic:true,color:"5B6472"});
  if(r.assessment.rubric && r.assessment.rubric.criteria){
    const rub = r.assessment.rubric;
    const rows = [[{text:"Criterion",options:{bold:true,fill:{color:NAVY},color:"FFFFFF"}}, ...rub.levels.map(l=>({text:l,options:{bold:true,fill:{color:NAVY},color:"FFFFFF"}}))]];
    rub.criteria.forEach((c,ci)=>{
      rows.push([{text:c,options:{bold:true}}, ...rub.levels.map((lv,li)=> ({text:(rub.cells[ci]&&rub.cells[ci][li])||""}))]);
    });
    s6.addTable(rows, {x:0.6,y:4.2,w:12.1,h:2.6, fontSize:10, autoPage:false, border:{type:"solid",color:"CCCCCC",pt:0.5}});
  }
  footer(s6, "Assessment");

  const refs = r.references||[];
  const perSlide = 10;
  for(let i=0;i<Math.max(1,Math.ceil(refs.length/perSlide));i++){
    let sr2 = pptx.addSlide(); if(useHC) sr2.background={color:"000000"};
    sr2.addText((i===0?"References":"References (cont.)")+" ("+r.session.citationStyle+")", {x:0.6,y:0.4,w:12,h:0.6,fontSize:22,bold:true,color:NAVY==="000000"?"FFFFFF":NAVY, fontFace:"Georgia"});
    const chunk = refs.slice(i*perSlide,(i+1)*perSlide);
    sr2.addText(chunk.map(c=>({text:c, options:{bullet:true, breakLine:true, fontSize:11.5, color:TXT}})), {x:0.6,y:1.1,w:12,h:5.7});
    footer(sr2, "References");
  }

  const fname = (r.session.sessionTopic || r.session.weekLabel || "lecture").replace(/[^a-z0-9]+/gi,"_").toLowerCase();
  await pptx.writeFile({fileName: "DataEdge_"+fname+(useHC?"_slides_HC.pptx":"_slides.pptx")});
}

function renderRubricHTML(rubric){
  if(!rubric || !rubric.criteria) return "";
  let t = `<h3 style="font-family:Georgia, serif; color:#0E1F38; margin-top:16px;">Assessment Rubric</h3>
  <table style="width:100%; border-collapse:collapse; font-size:10.5pt;">
  <tr><td style="border:1px solid #E2DED4; background:#0E1F38; color:#fff; padding:6px 8px;">Criterion</td>${rubric.levels.map(l=>`<td style="border:1px solid #E2DED4; background:#0E1F38; color:#fff; padding:6px 8px;">${esc(l)}</td>`).join('')}</tr>`;
  rubric.criteria.forEach((c,ci)=>{
    t += `<tr><td style="border:1px solid #E2DED4; padding:6px 8px; font-weight:bold; background:#FCFBF8;">${esc(c)}</td>${rubric.levels.map((lv,li)=>`<td style="border:1px solid #E2DED4; padding:6px 8px;">${esc((rubric.cells[ci]&&rubric.cells[ci][li])||"")}</td>`).join('')}</tr>`;
  });
  t += `</table>`;
  return t;
}

function downloadDocBlob(html, filename){
  const blob = new Blob(['\ufeff', html], {type: 'application/msword'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename; a.click();
  URL.revokeObjectURL(url);
}
function fnamePrefix(r){
  return "DataEdge_"+(r.session.sessionTopic || r.session.weekLabel || "lecture").replace(/[^a-z0-9]+/gi,"_").toLowerCase();
}

/* ---------------- export: Markdown ---------------- */
function exportMarkdown(){
  const r = state.result;
  let md = `# ${r.session.sessionTopic || r.session.weekLabel || "Lecture Session"}\n\n`;
  md += `${r.session.courseTitle||""} | ${r.session.weekLabel||""} | ${r.session.level} | ${r.session.duration} minutes\n\n`;
  if(r.recap){ md += `> Building on: ${r.recap.topic} (${(r.recap.blockTitles||[]).join(', ')})\n\n`; }
  md += `## Learning Objectives\n`;
  (r.objectives||[]).forEach((o,i)=>md+=`${i+1}. ${objText(o)}${o&&o.bloom_level?` [${o.bloom_level}${o.clo_refs&&o.clo_refs.length?", "+o.clo_refs.join(", "):""}]`:""}\n`);
  md += `\n## Session Timeline\n`;
  r.segments.forEach(seg=>md+=`- ${seg.title} (${seg.minutes} min)\n`);
  r.blocks.forEach((block,bi)=>{
    md += `\n## Block ${bi+1}: ${block.title}\n_${block.theme||""}_ (${block.minutes} min)\n\n`;
    (block.slides||[]).forEach(sl=>{
      md += `### ${sl.slide_title||""}${sl.citation && sl.citation.toLowerCase()!=="null" ? " "+sl.citation : ""}\n`;
      (sl.bullets||[]).forEach(b=>md+=`- ${b}\n`);
      md += `\n> Teaching notes: ${sl.speaker_notes||""}\n> Plain-language: ${sl.plain_summary||""}\n\n`;
    });
  });
  md += `\n## Engagement Activity\n**${r.engagement.title||""}**\n\n${r.engagement.instructions||""}\n\n`;
  md += `## Discussion Questions\n`;
  (r.discussionQuestions||[]).forEach((q,i)=>md+=`${i+1}. ${q}\n`);
  md += `\n## Wrap-up & Assessment\nIn-class check: ${r.assessment.formative_check||""}\n\n`;
  (r.assessment.assessment_ideas||[]).forEach(a=>md+=`- ${a}\n`);
  md += `\nTake-home: ${r.assessment.take_home_task||""}\n\n`;
  if(r.assessment.rubric && r.assessment.rubric.criteria){
    const rub = r.assessment.rubric;
    md += `### Rubric\n| Criterion | ${rub.levels.join(' | ')} |\n|---|${rub.levels.map(()=>'---').join('|')}|\n`;
    rub.criteria.forEach((c,ci)=>{ md += `| ${c} | ${rub.levels.map((lv,li)=>(rub.cells[ci]&&rub.cells[ci][li])||"").join(' | ')} |\n`; });
    md += `\n`;
  }
  md += `## References (${r.session.citationStyle})\n`;
  (r.references||[]).forEach(ref=>md+=`- ${ref}\n`);
  md += `\n---\n© ${new Date().getFullYear()} DataEdge Insights Ghana. All rights reserved.\n`;

  const blob = new Blob([md], {type:'text/markdown'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = fnamePrefix(r)+"_package.md"; a.click();
  URL.revokeObjectURL(url);
}

/* ---------------- rendering ---------------- */
function render(){
  const stepperEl = document.getElementById('stepper');
  const logoutBtn = document.getElementById('btn-logout');
  const resetBtn = document.getElementById('btn-reset-all');
  if(!state.accessGranted){
    logoutBtn.style.display = "none";
    resetBtn.style.display = "none";
    stepperEl.style.display = "none";
    stepperEl.innerHTML = "";
    const m = document.getElementById('main');
    m.innerHTML = "";
    m.appendChild(renderGate());
    return;
  }
  logoutBtn.style.display = "";
  resetBtn.style.display = "";
  stepperEl.style.display = "";
  renderStepper();
  const m = document.getElementById('main');
  m.innerHTML = "";
  if(state.step===1) m.appendChild(renderStep1());
  else if(state.step===2) m.appendChild(renderStep2());
  else if(state.step===3){
    m.appendChild(state.subscriptionActive ? renderStep3() : renderPaywall());
  }
  else if(state.step===4 || state.step==="loading"){
    m.appendChild(state.subscriptionActive ? renderStep4() : renderPaywall());
  }
  document.getElementById('archive-count-badge').textContent = state.archiveIndex.length;
  renderArchiveOverlay();
}

async function checkExistingAccess(){
  try{
    const rec = await appStorage.get('access-grant', false);
    if(rec){
      const parsed = JSON.parse(rec.value);
      if(parsed && parsed.code){
        const result = await verifyAccessCodeJSONP(parsed.code);
        if(result && result.valid){
          state.accessGranted = true;
          return;
        }
      }
    }
  }catch(e){ /* no existing grant */ }
}

/* A subscription/access code is unique per person and set month to month
   (not a fixed list baked into this file), so it can't be checked with a
   client-side hash trick alone. It's verified live against the sheet via
   the Apps Script endpoint. Since that endpoint can't return normal
   CORS-readable fetch responses (see submitSubscriptionRequest below),
   verification uses JSONP: a <script> tag pulling in a small JS snippet
   that calls a callback with the result. <script> tags aren't subject to
   CORS. */
function verifyCodeJSONP(action, code){
  // Originally used a <script src> JSONP technique, but that gets silently
  // blocked by some browsers' tracking-prevention features when loading a
  // dynamically-injected cross-origin script. A plain fetch() GET request
  // works reliably here (unlike POST, Apps Script's GET responses can be
  // read directly), so use that instead.
  const url = SUBSCRIPTION_VERIFY_URL
    + "?action=" + encodeURIComponent(action)
    + "&code=" + encodeURIComponent(code);
  const ctl = (typeof AbortController !== "undefined") ? new AbortController() : null;
  let timedOut = false;
  const timer = setTimeout(()=>{ timedOut = true; if(ctl){ try{ ctl.abort(); }catch(e){} } }, VERIFY_TIMEOUT_MS);
  return fetch(url, ctl ? {signal: ctl.signal} : undefined)
    .then(r=>r.text())
    .then(text=>{
      clearTimeout(timer);
      try{ return JSON.parse(text); }
      catch(e){ return {valid:false, reason:"parse_error"}; }
    })
    .catch(err=>{
      clearTimeout(timer);
      console.error("Verify request error:", err);
      return {valid:false, reason: timedOut ? "timeout" : "network"};
    });
}
function verifySubscriptionCodeJSONP(code){ return verifyCodeJSONP("verifySubscription", code); }
function verifyAccessCodeJSONP(code){ return verifyCodeJSONP("verifyAccess", code); }

async function checkExistingSubscription(){
  try{
    const rec = await appStorage.get('subscription-grant', false);
    if(!rec) return;
    const parsed = JSON.parse(rec.value);
    if(!parsed || !parsed.expires) return;
    // Cheap local check first: if the stored expiry has passed, don't
    // bother calling the server at all.
    if(new Date(parsed.expires) < new Date()) return;
    state.subscriptionActive = true;
    state.subscriptionExpires = parsed.expires;
  }catch(e){ /* no existing subscription */ }
}

async function submitGoogleForm(fields){
  if(!GOOGLE_FORM_ACTION) return false;
  // Google Apps Script Web Apps do not send back CORS headers, so a plain
  // fetch() gets blocked by the browser before it can even complete, no
  // matter the deployment settings. A hidden iframe + real <form> POST is
  // not subject to CORS (browsers only block JS from *reading* a
  // cross-origin response, not from *sending* one there), so this reaches
  // doPost() reliably from any origin, including local file:// pages.
  return new Promise((resolve)=>{
    try{
      const iframeName = "ge_submit_target_" + Date.now();
      const iframe = document.createElement('iframe');
      iframe.name = iframeName;
      iframe.style.display = 'none';
      document.body.appendChild(iframe);

      const form = document.createElement('form');
      form.action = GOOGLE_FORM_ACTION;
      form.method = 'POST';
      form.target = iframeName;
      form.style.display = 'none';

      Object.keys(GOOGLE_FORM_FIELDS).forEach(k=>{
        if(!GOOGLE_FORM_FIELDS[k]) return;
        const input = document.createElement('input');
        input.type = 'hidden';
        input.name = GOOGLE_FORM_FIELDS[k];
        input.value = fields[k] || "";
        form.appendChild(input);
      });

      document.body.appendChild(form);
      form.submit();

      // We can't read the cross-origin response (that's the whole point,
      // it avoids the CORS block), so we resolve success once the
      // navigation has had time to fire. The Apps Script side is what
      // actually writes to the sheet and sends the email.
      setTimeout(()=>{
        form.remove();
        iframe.remove();
        resolve(true);
      }, 800);
    }catch(e){
      console.error("Registration submit error:", e);
      resolve(false);
    }
  });
}

async function submitSubscriptionRequest(fields){
  if(!GOOGLE_FORM_ACTION) return false;
  // Same hidden-iframe POST technique as submitGoogleForm (Apps Script
  // doesn't return CORS headers, so a plain fetch gets blocked). The
  // formType field tells the Apps Script doPost() which sheet to log to.
  return new Promise((resolve)=>{
    try{
      const iframeName = "ge_sub_target_" + Date.now();
      const iframe = document.createElement('iframe');
      iframe.name = iframeName;
      iframe.style.display = 'none';
      document.body.appendChild(iframe);

      const form = document.createElement('form');
      form.action = GOOGLE_FORM_ACTION;
      form.method = 'POST';
      form.target = iframeName;
      form.style.display = 'none';

      const payload = {
        formType: "subscription",
        name: fields.name || "",
        email: fields.email || "",
        paymentRef: fields.paymentRef || ""
      };
      Object.keys(payload).forEach(k=>{
        const input = document.createElement('input');
        input.type = 'hidden';
        input.name = k;
        input.value = payload[k];
        form.appendChild(input);
      });

      document.body.appendChild(form);
      form.submit();

      setTimeout(()=>{
        form.remove();
        iframe.remove();
        resolve(true);
      }, 800);
    }catch(e){
      console.error("Subscription submit error:", e);
      resolve(false);
    }
  });
}

function buildMailtoFallback(fields){
  const subject = encodeURIComponent("Lecture Studio access request: "+(fields.name||""));
  const body = encodeURIComponent(
    "Name: "+(fields.name||"")+"\n"+
    "Email: "+(fields.email||"")+"\n"+
    "What I need the tool for: "+(fields.purpose||"")+"\n"+
    "Country: "+(fields.country||"")+"\n"+
    "State/Region: "+(fields.region||"")+"\n"+
    "Sector: "+(fields.sector||"")+"\n"
  );
  return `mailto:${NOTIFY_EMAIL}?subject=${subject}&body=${body}`;
}

function renderGate(){
  const wrap = el(`<div class="gate-wrap">
    <div class="gate-card">
      <img class="gate-logo" src="${LOGO_DATA_URI}" alt="DataEdge Insights logo">
      <h2>DataEdge Lecture Studio</h2>
      <div class="gate-sub">Request access below, or enter a code if you already have one.</div>
      <div id="gate-body"></div>
    </div>
    <div class="gate-footer-note">&copy; ${new Date().getFullYear()} DataEdge Insights Ghana.</div>
  </div>`);

  const body = wrap.querySelector('#gate-body');

  if(state.gateTab === 'code'){
    body.innerHTML = "";
    const form = el(`<div>
      <label>Name</label><input id="g-name" type="text" placeholder="Your full name">
      <label>Access code</label><input id="g-code" type="text" placeholder="Enter the code you were given">
      ${state.gateError ? `<div class="errbox">${esc(state.gateError)}</div>` : ""}
      <div class="btnrow"><button class="btn btn-primary" id="g-submit" style="width:100%; justify-content:center;">${state.gateChecking ? "Checking..." : "Enter"}</button></div>
      <div class="fieldnote" style="margin-top:12px; text-align:center;"><a href="#" id="g-back-to-register">Back to registration</a></div>
    </div>`);
    body.appendChild(form);
    const doSubmit = async ()=>{
      const name = form.querySelector('#g-name').value.trim();
      const code = form.querySelector('#g-code').value.trim();
      if(!name){ state.gateError = "Please enter your name."; render(); return; }
      if(!code){ state.gateError = "Please enter your access code."; render(); return; }
      state.gateError = null;
      state.gateChecking = true;
      render();
      // Every code must be present in the approvals sheet. There is no
      // built-in or fallback code: if the sheet does not recognise it, or
      // cannot be reached, access is refused.
      const result = await verifyAccessCodeJSONP(code);
      state.gateChecking = false;
      if(result && result.valid){
        try{ await appStorage.set('access-grant', JSON.stringify({name, code, grantedAt:new Date().toISOString()}), false); }catch(e){}
        state.accessGranted = true;
        render();
        return;
      }
      state.gateError = (result && (result.reason === "network" || result.reason === "timeout"))
        ? "Could not reach the server to check that code. Check your connection and try again."
        : "That code wasn't recognized. Check it, or register below instead.";
      render();
    };
    form.querySelector('#g-submit').addEventListener('click', doSubmit);
    form.querySelector('#g-code').addEventListener('keydown', (e)=>{ if(e.key==='Enter') doSubmit(); });
    form.querySelector('#g-back-to-register').addEventListener('click', (e)=>{ e.preventDefault(); state.gateTab='request'; state.gateError=null; render(); });
    return wrap;
  }

  // Default path: registration submits a request; an emailed code (set up
  // separately via Google Apps Script) is what actually grants access.
  body.innerHTML = "";

  if(state.gateSubmitted){
    body.appendChild(el(`<div class="gate-success">
      <div class="big-check">&#10003;</div>
      <p>Thank you for registering. Your request has been recorded. If your registration is approved, you will receive an access code by email.</p>
      <button class="btn btn-secondary" id="g-back-to-code-from-success">I already have a code</button>
    </div>`));
    body.querySelector('#g-back-to-code-from-success').addEventListener('click', ()=>{ state.gateTab='code'; state.gateSubmitted=false; render(); });
    return wrap;
  }

  const form = el(`<div>
    <label>Name</label><input id="g-name" type="text" placeholder="Your full name">
    <label>Email</label><input id="g-email" type="text" placeholder="you@example.com">
    <label>What do you need the tool for?</label><textarea id="g-purpose" rows="3" placeholder="e.g. Preparing lectures for a Masters-level research methods course"></textarea>
    <div class="row">
      <div><label>Country</label><select id="g-country"><option value="">Select...</option>${COUNTRY_OPTIONS.map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join('')}</select></div>
      <div><label>State / Region</label><input id="g-region" type="text" placeholder="e.g. Greater Accra"></div>
    </div>
    <label>Sector</label>
    <select id="g-sector">${SECTOR_OPTIONS.map(s=>`<option value="${esc(s)}">${esc(s)}</option>`).join('')}</select>
    <div id="g-sector-other-wrap" style="display:none; margin-top:10px;"><input id="g-sector-other" type="text" placeholder="Please specify"></div>
    <label class="terms-row" for="g-terms">
      <input type="checkbox" id="g-terms">
      <span>I have read and agree to the <a href="../tools-terms.html" target="_blank" rel="noopener">Terms &amp; Conditions</a> of the Digital Tool Suite.</span>
    </label>
    ${state.gateError ? `<div class="errbox">${esc(state.gateError)}</div>` : ""}
    <div class="btnrow"><button class="btn btn-primary" id="g-request-submit" style="width:100%; justify-content:center;">Send request</button></div>
    <div class="fieldnote" style="margin-top:12px; text-align:center;"><a href="#" id="g-to-code">I already have an access code</a></div>
  </div>`);
  body.appendChild(form);
  form.querySelector('#g-sector').addEventListener('change', (e)=>{
    form.querySelector('#g-sector-other-wrap').style.display = e.target.value === 'Other' ? '' : 'none';
  });
  form.querySelector('#g-to-code').addEventListener('click', (e)=>{ e.preventDefault(); state.gateTab='code'; state.gateError=null; render(); });
  form.querySelector('#g-request-submit').addEventListener('click', async (e)=>{
    const fields = {
      name: form.querySelector('#g-name').value.trim(),
      email: form.querySelector('#g-email').value.trim(),
      purpose: form.querySelector('#g-purpose').value.trim(),
      country: form.querySelector('#g-country').value.trim(),
      region: form.querySelector('#g-region').value.trim(),
      sector: form.querySelector('#g-sector').value === 'Other' ? form.querySelector('#g-sector-other').value.trim() : form.querySelector('#g-sector').value
    };
    const termsBox = form.querySelector('#g-terms');
    if(!fields.name || !fields.email || !fields.purpose || !fields.country){
      state.gateError = "Please fill in your name, email, what you need the tool for, and your country.";
      render();
      return;
    }
    if(!termsBox || !termsBox.checked){
      state.gateError = "Please read and agree to the Terms & Conditions before sending your request.";
      render();
      return;
    }
    fields.agreedTerms = "yes";
    fields.termsVersion = "1.2";
    fields.agreedAt = new Date().toISOString();
    state.gateError = null;
    e.target.disabled = true; e.target.textContent = "Sending...";
    const ok = await submitGoogleForm(fields);
    if(!ok){
      window.open(buildMailtoFallback(fields), '_blank');
    }
    state.gateSubmitted = true;
    render();
  });

  return wrap;
}

function renderStepper(){
  const labels = ["Course Context","Source Materials","Review & Generate","Studio"];

  wrap.innerHTML = "";
  const effStep = state.step === "loading" ? 4 : state.step;
  labels.forEach((lab,i)=>{
    const n=i+1;
    const cls = n===effStep ? "active" : (n<effStep ? "done" : "");
    const pill = el(`<div class="step-pill ${cls}"><span class="num">${n}</span><span>${lab}</span></div>`);
    if(n<effStep){ pill.addEventListener('click',()=>{ state.step=n; render(); }); }
    wrap.appendChild(pill);
  });
}

    </div>
  </div>`);

  if(showBanner){
    const brr = wrap.querySelector('#btn-resume-result');
    if(brr) brr.addEventListener('click', restoreDraftResult);
    const bdr = wrap.querySelector('#btn-discard-result');
    if(bdr) bdr.addEventListener('click', async ()=>{ state.draftResult=null; await clearDraftResult(); render(); });
    const brs = wrap.querySelector('#btn-resume-session');
    if(brs) brs.addEventListener('click', restoreDraftSession);
    const bds = wrap.querySelector('#btn-discard-session');
    if(bds) bds.addEventListener('click', async ()=>{ state.draftSession=null; await clearDraftSession(); render(); });
  }

  const fCourse = wrap.querySelector('#f-course');
  const fWeek = wrap.querySelector('#f-week');
  const fTopic = wrap.querySelector('#f-topic');
  const fLevel = wrap.querySelector('#f-level');
  const fDuration = wrap.querySelector('#f-duration');
  const fEmphasis = wrap.querySelector('#f-emphasis');
  const fClos = wrap.querySelector('#f-clos');
  const fCiteStyle = wrap.querySelector('#f-citestyle');
  const recapSel = wrap.querySelector('#f-recap');

  fCourse.value = state.session.courseTitle;
  fWeek.value = state.session.weekLabel;
  fTopic.value = state.session.sessionTopic;
  fLevel.value = state.session.level;
  fDuration.value = state.session.duration;
  fEmphasis.value = state.session.emphasis;
  fClos.value = state.clos;
  fCiteStyle.value = state.session.citationStyle;

  state.archiveIndex.forEach(entry=>{
    const opt = document.createElement('option');
    opt.value = entry.id;
    opt.textContent = `${entry.sessionTopic || entry.weekLabel || "Untitled"} (${entry.weekLabel||""})`;
    recapSel.appendChild(opt);
  });
  recapSel.value = state.recapSessionId || "";

  // Live-bind every field so a draft can be recovered even if the user
  // never clicks "Continue" before closing the tab.
  fCourse.addEventListener('input', ()=>{ state.session.courseTitle = fCourse.value; scheduleAutosave(); });
  fWeek.addEventListener('input', ()=>{ state.session.weekLabel = fWeek.value; scheduleAutosave(); });
  fTopic.addEventListener('input', ()=>{ state.session.sessionTopic = fTopic.value; scheduleAutosave(); });
  fLevel.addEventListener('change', ()=>{ state.session.level = fLevel.value; scheduleAutosave(); });
  fDuration.addEventListener('input', ()=>{ state.session.duration = parseInt(fDuration.value)||180; scheduleAutosave(); });
  fEmphasis.addEventListener('change', ()=>{ state.session.emphasis = fEmphasis.value; scheduleAutosave(); });
  fClos.addEventListener('input', ()=>{ state.clos = fClos.value; scheduleAutosave(); });
  fCiteStyle.addEventListener('change', ()=>{ state.session.citationStyle = fCiteStyle.value; scheduleAutosave(); });
  recapSel.addEventListener('change', ()=>{ state.recapSessionId = recapSel.value; scheduleAutosave(); });

  wrap.querySelector('#btn-next1').addEventListener('click', ()=>{
    state.step = 2;
    scheduleAutosave();
    render();
  });
  return wrap;
}

function renderStep2(){
  const wrap = el(`<div>
    <div class="card">
      <h2>Syllabus <span style="font-family:var(--mono); font-size:12px; color:var(--muted); font-weight:400;">(optional, recommended)</span></h2>
      <p class="hint">Upload the course syllabus so the studio can align objectives and terminology with it.</p>
      <div class="dropzone" id="dz-syllabus">
        <span class="big">Drop syllabus here, or click to browse</span>
        <span class="small">PDF or DOCX</span>
      </div>
      <input type="file" id="fi-syllabus" accept=".pdf,.docx,.doc,.txt" style="display:none;">
      <div class="linkrow">
        <input type="text" id="link-syllabus" placeholder="Or paste a link to the syllabus (PDF, Google Drive, or Google Docs)">
        <button class="btn btn-secondary" id="btn-fetch-syllabus" type="button">Fetch</button>
      </div>
      <div class="filelist" id="syllabus-list"></div>
    </div>
    <div class="card">
      <h2>Recommended & Relevant Publications</h2>
      <p class="hint">Upload the readings for this session, or paste links. The studio extracts text from each and cites them where appropriate.</p>
      <div class="dropzone" id="dz-pubs">
        <span class="big">Drop readings here, or click to browse</span>
        <span class="small">PDF, DOCX, or TXT &mdash; multiple files supported</span>
      </div>
      <input type="file" id="fi-pubs" accept=".pdf,.docx,.doc,.txt,.md" multiple style="display:none;">
      <div class="linkrow">
        <input type="text" id="link-pub" placeholder="Or paste a link to a reading (PDF, Google Drive, or Google Docs)">
        <button class="btn btn-secondary" id="btn-fetch-pub" type="button">Add link</button>
      </div>
      <div class="fieldnote" style="margin-top:8px;">Most links will not work, and that is normal: sites including Google Docs and Google Drive do not allow a browser tool to read their files directly. <strong>Uploading is the reliable route</strong>, and it keeps the document on your own device, so use it for anything confidential.</div>
      <div class="filelist" id="pubs-list"></div>
    </div>
    <div class="btnrow">
      <button class="btn btn-secondary" id="btn-back2">&larr; Back</button>
      <button class="btn btn-primary" id="btn-next2">Continue to Review &rarr;</button>
    </div>
  </div>`);

  function refreshSyllabusList(){
    const box = wrap.querySelector('#syllabus-list');
    box.innerHTML = "";
    if(state.syllabus){
      const item = el(`<div class="fileitem"><span class="ficon">${state.syllabus.viaLink?'LINK':'SYL'}</span><span class="finame">${esc(state.syllabus.name)}</span><span class="fimeta">${state.syllabus.text.length.toLocaleString()} chars</span><button class="firemove">Remove</button></div>`);
      item.querySelector('.firemove').addEventListener('click', ()=>{ state.syllabus=null; refreshSyllabusList(); scheduleAutosave(); });
      box.appendChild(item);
    }
  }
  function refreshPubsList(){
    const box = wrap.querySelector('#pubs-list');
    box.innerHTML = "";
    state.publications.forEach(p=>{
      const item = el(`<div class="fileitem ${p.warn?'warn':''}">
        <span class="ficon">${p.viaLink ? 'LINK' : esc(p.ext.toUpperCase())}</span>
        <span class="finame">${esc(p.name)}${p.warn?`<div class="fiwarn">${esc(p.warn)}</div>`:""}</span>
        <span class="fimeta">${p.text.length.toLocaleString()} chars</span>
        <button class="firemove">Remove</button>
      </div>`);
      item.querySelector('.firemove').addEventListener('click', ()=>{
        state.publications = state.publications.filter(x=>x.id!==p.id);
        refreshPubsList();
        scheduleAutosave();
      });
      box.appendChild(item);
    });
  }
  refreshSyllabusList();
  refreshPubsList();

  const dzS = wrap.querySelector('#dz-syllabus');
  const fiS = wrap.querySelector('#fi-syllabus');
  dzS.addEventListener('click', ()=>fiS.click());
  fiS.addEventListener('change', async (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    dzS.querySelector('.big').textContent = "Reading "+file.name+"...";
    const {text, warn} = await extractFromFile(file);
    state.syllabus = {name:file.name, text: text||"", viaLink:false};
    dzS.querySelector('.big').textContent = "Drop syllabus here, or click to browse";
    refreshSyllabusList();
    scheduleAutosave();
    if(warn){ alert(warn); }
  });
  ['dragover','dragleave','drop'].forEach(evt=>{
    dzS.addEventListener(evt, (e)=>{ e.preventDefault(); if(evt==='dragover') dzS.classList.add('drag'); else dzS.classList.remove('drag'); });
  });
  dzS.addEventListener('drop', (e)=>{ if(e.dataTransfer.files[0]){ fiS.files = e.dataTransfer.files; fiS.dispatchEvent(new Event('change')); } });

  const btnFetchSyl = wrap.querySelector('#btn-fetch-syllabus');
  const linkSylInput = wrap.querySelector('#link-syllabus');
  btnFetchSyl.addEventListener('click', async ()=>{
    const url = linkSylInput.value.trim();
    if(!url) return;
    btnFetchSyl.disabled = true; btnFetchSyl.textContent = "Fetching...";
    try{
      const {text, warn, label} = await fetchDocFromUrl(url);
      state.syllabus = {name: label || url, text: text||"", viaLink:true};
      refreshSyllabusList();
      scheduleAutosave();
      if(warn) alert(warn);
      linkSylInput.value = "";
    }catch(err){
      alert(err.message);
    }
    btnFetchSyl.disabled = false; btnFetchSyl.textContent = "Fetch";
  });

  const dzP = wrap.querySelector('#dz-pubs');
  const fiP = wrap.querySelector('#fi-pubs');
  dzP.addEventListener('click', ()=>fiP.click());
  async function handlePubFiles(fileList){
    for(const file of fileList){
      const ext = file.name.split('.').pop().toLowerCase();
      const id = ++fileCounter;
      state.publications.push({id, name:file.name, ext, text:"", warn:"loading...", viaLink:false});
      refreshPubsList();
      const {text, warn} = await extractFromFile(file);
      const rec = state.publications.find(x=>x.id===id);
      if(rec){ rec.text = text||""; rec.warn = warn; }
      refreshPubsList();
      scheduleAutosave();
    }
  }
  fiP.addEventListener('change', (e)=>{ handlePubFiles(Array.from(e.target.files)); });
  ['dragover','dragleave','drop'].forEach(evt=>{
    dzP.addEventListener(evt, (e)=>{ e.preventDefault(); if(evt==='dragover') dzP.classList.add('drag'); else dzP.classList.remove('drag'); });
  });
  dzP.addEventListener('drop', (e)=>{ if(e.dataTransfer.files.length){ handlePubFiles(Array.from(e.dataTransfer.files)); } });

  const btnFetchPub = wrap.querySelector('#btn-fetch-pub');
  const linkPubInput = wrap.querySelector('#link-pub');
  async function addPubLink(){
    const url = linkPubInput.value.trim();
    if(!url) return;
    const id = ++fileCounter;
    btnFetchPub.disabled = true; btnFetchPub.textContent = "Fetching...";
    state.publications.push({id, name:url, ext:'link', text:"", warn:"loading...", viaLink:true});
    refreshPubsList();
    try{
      const {text, warn, label, ext} = await fetchDocFromUrl(url);
      const rec = state.publications.find(x=>x.id===id);
      if(rec){ rec.text = text||""; rec.warn = warn; rec.name = label || url; rec.ext = ext || 'link'; }
      linkPubInput.value = "";
    }catch(err){
      state.publications = state.publications.filter(x=>x.id!==id);
      alert(err.message);
    }
    refreshPubsList();
    scheduleAutosave();
    btnFetchPub.disabled = false; btnFetchPub.textContent = "Add link";
  }
  btnFetchPub.addEventListener('click', addPubLink);
  linkPubInput.addEventListener('keydown', (e)=>{ if(e.key==='Enter'){ e.preventDefault(); addPubLink(); } });

  wrap.querySelector('#btn-back2').addEventListener('click', ()=>{ state.step=1; scheduleAutosave(); render(); });
  wrap.querySelector('#btn-next2').addEventListener('click', ()=>{ state.step=3; scheduleAutosave(); render(); });
  return wrap;
}

function renderLoading(){
  const total = state.tasks.length;
  const done = state.tasks.filter(t=>t.status==='done').length;
  const errored = state.tasks.filter(t=>t.status==='error').length;
  const wrap = el(`<div class="card loading-panel">
    <div class="spinner"></div>
    <div class="stage">${esc(state.loadingStage||"Starting...")}</div>
    ${total ? `<div class="fieldnote" style="text-align:center; margin-top:6px;">${done} of ${total} done${errored?` &middot; ${errored} had a problem and used a fallback`:""}</div>` : ""}
    <div class="stagelist" id="stagelist"></div>
  </div>`);
  const list = wrap.querySelector('#stagelist');
  state.tasks.forEach(t=>{
    const icon = t.status==='done' ? '&#10003;' : (t.status==='error' ? '&#9888;' : '&hellip;');
    const cls = t.status==='done' ? 'done' : (t.status==='error' ? 'error' : 'active');
    const extra = t.status==='error' ? ` <span style="color:var(--danger); font-size:10.5px;">(${esc(t.error||'failed')}; continuing with a fallback)</span>` : '';
    list.appendChild(el(`<div class="${cls}">${icon} ${esc(t.label)}${extra}</div>`));
  });
  return wrap;
}

function renderTimeline(r){
  const total = r.segments.reduce((a,s)=>a+s.minutes,0);
  const bar = r.segments.map(seg=>`<div class="tseg" style="width:${(seg.minutes/total*100).toFixed(2)}%; background:${SEG_COLORS[seg.type]};" title="${esc(seg.title)} (${seg.minutes} min)">${seg.minutes>=15?seg.minutes+"m":""}</div>`).join('');
  const legendTypes = [...new Set(r.segments.map(s=>s.type))];
  const legend = legendTypes.map(t=>`<div class="tleg"><span class="sw" style="background:${SEG_COLORS[t]};"></span>${t}</div>`).join('');
  const rows = r.segments.map(seg=>`<div class="tblock-row"><span class="t-name">${esc(seg.title)}</span><span class="t-min">${seg.minutes} min</span></div>`).join('');
  let html = `<div class="timeline-wrap">
    <div class="timeline-title">Session Timeline &mdash; ${total} minutes total</div>
    <div class="timeline-bar">${bar}</div>
    <div class="timeline-legend">${legend}</div>
    <div class="timeline-blocks">${rows}</div>
  </div>`;
  if(r.recap){
    html += `<div class="recap-banner"><b>Building on:</b> ${esc(r.recap.topic)} &mdash; ${esc((r.recap.blockTitles||[]).join(', '))}</div>`;
  }
  html += `<h3 style="font-family:var(--serif); color:var(--navy-deep); font-size:20px;">Learning Objectives</h3>
    <ul class="objectives-list">${(r.objectives||[]).map((o,i)=>{
      const bloom = o && o.bloom_level;
      const clos = o && o.clo_refs && o.clo_refs.length ? o.clo_refs : [];
      return `<li><span class="onum">${String(i+1).padStart(2,'0')}</span><div><div>${esc(objText(o))}</div>
        <div class="obj-tags">${bloom?`<span class="bloom-badge" style="background:${BLOOM_COLORS[bloom]||'#5B6472'};">${esc(bloom)}</span>`:""}${clos.map(c=>`<span class="clo-tag">${esc(c)}</span>`).join('')}</div></div></li>`;
    }).join('')}</ul>`;
  return html;
}

function renderArchiveOverlay(){
  const overlay = document.getElementById('archive-overlay');
  if(!state.archiveOpen){ overlay.classList.add('hidden'); overlay.innerHTML=""; return; }
  overlay.classList.remove('hidden');
  const cloCoverage = {};
  state.archiveIndex.forEach(e=>(e.cloRefs||[]).forEach(c=>{ cloCoverage[c] = (cloCoverage[c]||0)+1; }));
  const cloBadges = Object.keys(cloCoverage).sort().map(c=>`<span class="clo-tag">${esc(c)} &times;${cloCoverage[c]}</span>`).join(' ');

  overlay.innerHTML = `<div class="archive-panel">
    <button class="archive-close" id="archive-close">&times;</button>
    <h2>Session Archive</h2>
    <p class="hint">Saved sessions live in this browser's storage for this tool. ${cloBadges ? `<br><b>CLO coverage so far:</b> ${cloBadges}` : ""}</p>
    <div id="archive-rows"></div>
  </div>`;
  const rowsBox = overlay.querySelector('#archive-rows');
  if(state.archiveIndex.length===0){
    rowsBox.innerHTML = `<div class="archive-empty">No sessions saved yet. Generate a session and click "Save to Archive" in the Studio tab.</div>`;
  } else {
    state.archiveIndex.forEach(entry=>{
      const row = el(`<div class="archive-row">
        <div class="ainfo">
          <div class="atitle2">${esc(entry.sessionTopic || entry.weekLabel || "Untitled session")}</div>
          <div class="ameta">${esc(entry.courseTitle||"")} &middot; ${esc(entry.weekLabel||"")} &middot; ${new Date(entry.generatedAt).toLocaleDateString()}</div>
          <div class="aclos">${(entry.cloRefs||[]).map(c=>`<span class="clo-tag">${esc(c)}</span>`).join('')}</div>
        </div>
        <div class="archive-actions">
          <button class="primary" data-act="open">Open</button>
          <button data-act="recap">Use for recap</button>
          <button class="danger" data-act="delete">Delete</button>
        </div>
      </div>`);
      row.querySelector('[data-act=open]').addEventListener('click', async ()=>{
        const full = await loadSessionFromStorage(entry.id);
        if(full){ state.result = full; state.step = 4; state.resultTab="timeline"; state.archiveOpen=false; render(); }
      });
      row.querySelector('[data-act=recap]').addEventListener('click', ()=>{
        state.recapSessionId = entry.id; state.archiveOpen = false; state.step = 1; render();
      });
      row.querySelector('[data-act=delete]').addEventListener('click', async ()=>{
        if(confirm("Delete this saved session? This cannot be undone.")){
          await deleteSessionFromStorage(entry.id);
          renderArchiveOverlay();
          document.getElementById('archive-count-badge').textContent = state.archiveIndex.length;
        }
      });
      rowsBox.appendChild(row);
    });
  }
  overlay.querySelector('#archive-close').addEventListener('click', ()=>{ state.archiveOpen=false; render(); });
}

function renderStep4(){
  if(!state.result && state.error){
    const wrap = el(`<div class="card">
      <h2>Something went wrong</h2>
      <div class="errbox">${esc(state.error)}</div>
      <div class="btnrow">
        <button class="btn btn-secondary" id="btn-back-err">&larr; Back to Review</button>
