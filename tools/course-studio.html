o trial is fully featured but time boxed (typically 14 days from activation). Treat this module set as a sprint: install once, and build one real working project immediately, rather than experimenting in throwaway files. If the trial lapses mid course, Lumivero's academic licensing (via your university's site license or a student/instructor rate) is the path to continued access, worth confirming with your university's IT or library before day 10."},{type:"p",text:"NVivo 15 project files use the .nvpx format (or .nvp for older style single file projects). Projects live locally on your machine by default; Collaboration Cloud projects sync but are still edited through the desktop app. Nothing here requires you to be online except AI Assistant features and cloud sync."}]}],practice:{title:"Set up your teaching project",steps:["Download the NVivo 15 trial from the Lumivero website and run the installer. When it opens for the first time, enter the trial license key from the confirmation email, or sign in if your university already has a site license.","On the Welcome screen, click New Project, or Blank Project if that is the label you see.","In the dialog that appears, type a Title such as Horizon Fellowship Teaching Demo, and paste a one sentence Description of the project's purpose into the Description field.","Click Browse next to the file location field. Navigate to a folder you will remember, type a File name without spaces, for example Horizon_Fellowship_Teaching_Demo, and click Save.","Back in the dialog, confirm the details and click OK on Windows or Create on Mac. NVivo creates the project and opens it into an empty workspace.","Open Project Properties from the File menu (or the ribbon, depending on your version) and confirm the description you entered is showing correctly, this is the habit worth teaching: every project should be self documenting from minute one."]},quiz:[{q:"What does NVivo primarily provide that manual coding (e.g. in Word or Excel) does not?",options:["Automatic theory generation","A structured, auditable, and query able coding system","Statistical significance testing","Data collection tools"],correct:1},{q:"Where do quantitative demographic variables (age, sex, district) belong in an NVivo project?",options:["Node hierarchy","Case classifications","Memos","Sets"],correct:1}]},{id:"m1",num:"01",track:"foundations",title:"The Workspace",subtitle:"Ribbon, Navigation View, Detail View, and the Windows/Mac split",time:"45 min",objectives:["Locate and use the four main workspace zones","Explain the practical feature differences between NVivo 15 Windows and Mac","Customize the workspace for a coding heavy workflow"],sections:[{heading:"Reading the screen",blocks:[{type:"list",items:["Ribbon (top): every command, organized by tab, Home, Import, Create, Explore, Share.","Navigation View (left): your project's skeleton, Files, Codes, Cases, Notes, Collections, Queries, Reports.","List View (middle): the contents of whatever's selected in Navigation View.","Detail View (right/main): the actual source content, where coding happens."]},{type:"callout",variant:"sage",text:"Teaching tip: have students screenshot this four zone layout on day one and label it themselves. Spatial memory of the workspace prevents 80% of early 'I can't find X' questions."}]},{heading:"Windows vs Mac, what to tell your cohort",blocks:[{type:"p",text:"Historically Mac NVivo trailed Windows in features; as of the 15.3 release that gap has narrowed substantially, Framework Matrices, previously Windows only, are now on Mac. Differences still worth flagging to a mixed device classroom: PCA visualization remains Windows only, and some collaboration/administration controls differ. If your program has both Windows and Mac students, confirm feature parity for the specific tools you plan to assess before finalizing a syllabus."}]}],practice:{title:"Workspace tour",steps:["In the Navigation View panel on the left, click Files, then Codes, then Cases, then Notes, then Queries, then Reports in turn, one at a time, simply to see each area populate in List View to its right.","Right click inside the Navigation View panel and check for an option to reorder or pin the sections you will use most, Files, Codes, and Cases are worth keeping near the top for a coding heavy workflow.","Hover over the border between List View and Detail View and drag it to resize, giving Detail View more room, since that is where you will spend most of your time once coding begins.","Open a blank Word document or memo and write one sentence for each Navigation View section, noting what is currently empty, this becomes your baseline before Module 02 starts filling the project in.","Click through the ribbon tabs across the top, Home, Import, Create, Explore, and Share, just to see what commands live under each, without changing anything yet."]},quiz:[{q:"Which workspace zone shows the actual text you code against?",options:["Navigation View","List View","Detail View","Ribbon"],correct:2},{q:"As of NVivo 15.3, which feature closed the Mac/Windows gap?",options:["AI Assistant","Framework Matrices on Mac","PCA visualization on Mac","Word frequency queries"],correct:1}]},{id:"m2",num:"02",track:"foundations",title:"Importing & Organizing Sources",subtitle:"Transcripts, PDFs, datasets, media, and social captures",time:"1 hr",objectives:["Import at least four different source types correctly","Choose between Folders, Sets, and Classifications for organizing a real project","Import a dataset (survey export) with variables intact"],sections:[{heading:"Source types you'll actually use",blocks:[{type:"list",items:["Documents/PDFs: interview and FGD transcripts, policy documents, legislation texts.","Datasets: structured survey exports (CSV/Excel/SPSS) imported so each row becomes a case with variables, central to mixed methods demography work.","Audio/Video: raw recordings, transcribed inside NVivo or imported alongside an external transcript.","Images: photovoice or fieldwork photographs, coded region by region.","Web pages & social media: captured via NCapture (a separate browser extension) for online discourse analysis."]}]},{heading:"Organizing without chaos",blocks:[{type:"p",text:"Three organizing tools solve three different problems, and conflating them is the single most common source of a tangled project."},{type:"list",items:["Folders: physical filing, where a source lives (e.g. 'Ghana / District Hubs / Transcripts').","Sets: flexible groupings that cut across folders (e.g. 'All GBV related sources', regardless of type or location).","Classifications: structured, attribute based data attached to sources or cases, this is what lets you later ask 'what did rural respondents under 18 say about X'."]},{type:"callout",variant:"amber",text:"For a 13 month program like Girls Lead with Data, set up folders by data collection wave (Baseline / Midline / Endline) from the start. Retrofitting this structure after 100 transcripts are already imported is painful and avoidable."}]}],practice:{title:"Build a real import batch",steps:["On the ribbon, click Import, then Import Files. In the browse window, hold Ctrl on Windows or Cmd on Mac and select two or three transcripts at once, then click Open to bring them all in together.","Check Files in Navigation View, you should now see each transcript listed as its own source.","On the ribbon, click Import again, then Import Dataset or Import Survey depending on your version's wording. Browse to a small spreadsheet with columns like Age, Sex, District, and Education level, and step through the preview screen NVivo shows before finishing the import.","Confirm the import worked by clicking Cases in Navigation View, each row from your spreadsheet should now appear as its own case.","Right click Files in Navigation View, choose New Folder, and name it something like Transcripts, Wave 1. Drag your imported sources into it.","Right click Sets in Navigation View, choose New Set, name it something cross cutting like All Economic Inclusion Sources, and drag in whichever sources are relevant regardless of which folder they sit in.","In a short memo, note why you organized things that way, the distinction between a folder as a filing location and a set as a flexible grouping is worth being able to explain to a class."]},quiz:[{q:"You want a group of sources that cuts across multiple folders (e.g. all sources mentioning GBV). What do you use?",options:["A Folder","A Set","A Classification","A Node"],correct:1},{q:"Importing a structured survey export (CSV/Excel) as a Dataset does what automatically?",options:["Deletes open ended responses","Turns each row into a case with attached variables","Runs sentiment analysis","Creates a Framework Matrix"],correct:1}]},{id:"m2t",num:"03",track:"foundations",title:"Transcribing Audio and Video",subtitle:"Three routes into text, and when to choose each one",time:"1 hr",objectives:["Transcribe a recording manually inside NVivo using synchronized timestamps","Use NVivo Transcription, the built in automated service, and know its limits","Import an existing transcript and know when autocoding by speaker applies"],sections:[{heading:"Three ways to turn a recording into text",blocks:[{type:"p",text:"Transcription is often the first practical obstacle a new NVivo user meets, and it deserves its own module rather than a footnote. NVivo supports three distinct routes, and the right choice depends on data volume, budget, and confidentiality requirements, not on personal preference."},{type:"list",items:["Manual transcription inside NVivo: import the audio or video file, open it in edit mode, and on the Audio or Video tab switch Play Mode to Transcribe. Playing the file creates a new transcript row each time playback stops, with a timestamp attached automatically. Play speed can be slowed for accuracy, and shortcut keys handle play, pause, and skip. The result is a transcript fully synchronized with the original media, so clicking any line jumps playback to that moment.","NVivo Transcription, the built in automated service: a paid, machine learning based service accessed from the Modules tab. Add the audio or video files, choose the spoken language for each, and click Transcribe. Files upload to the transcription platform and typically process in roughly half the length of the original recording, then download back into the project synchronized with the media, ready for review in the built in editor with speaker labeling and find and replace tools.","Importing an existing transcript: if transcripts already exist as Word documents, produced by a research assistant, a professional service, or another tool, they can simply be imported as document sources. This is the fastest route, though the transcript will not be time synchronized with any separate media file unless both are kept in the project and cross referenced manually."]}]},{heading:"What to tell students about the automated service",blocks:[{type:"list",items:["File limits: each file must be under four gigabytes and under four hours in duration.","Data handling: audio is automatically deleted ninety days after transcription or after the transcript was last edited.","Accuracy: expect a starting point around ninety percent for clear audio, lower for heavy accents, overlapping speakers, or specialized terminology, so budget real time for correction rather than treating the output as final."]},{type:"callout",variant:"amber",text:"For identifiable interviews under a strict ethics protocol, manual in app transcription is often the safer choice, since it avoids sending audio to any external service at all. Reserve the automated service for larger volumes of lower sensitivity material."}]},{heading:"A shortcut worth teaching: autocoding by speaker",blocks:[{type:"p",text:"Where a transcript has a clear speaker column, whether produced manually, through NVivo Transcription, or imported, NVivo can autocode using that structure, gathering everything a named speaker said into a single node automatically. This is a fast way to organize a focus group or key informant interview before deeper thematic coding begins."},{type:"callout",variant:"rose",text:"A caution worth stating plainly to any class: transcribing a file, by hand or automatically, does not by itself enter any text into the coding scheme. Transcription produces text to work with. Coding is a separate, deliberate act of tagging that text against nodes, and the two should never be conflated in a methods section."}]}],practice:{title:"Record, prepare, and import a practice clip",steps:["Read the four minute practice script aloud into a phone or computer voice recorder. If a colleague is available, have them read every Interviewer line while you read every Respondent line, this gives you a genuine two speaker recording to test speaker labeling with later. Reading alone works too, a small shift in tone between the two roles is enough.","Save the recording. If your recorder saves as a raw AAC file, convert it first, NVivo's file browser often will not show a plain .aac file even though the audio itself is fine. On Mac, open it in QuickTime Player and use File, Export As, Audio Only, which saves it as .m4a. On Windows, or if you prefer, open it in VLC, use Media, Convert or Save, and choose an MP3 or M4A profile. A free online AAC to MP3 converter also works for a short, non sensitive practice file like this one.","Name the file clearly as practice material so it never gets mistaken for a real case later, something like Horizon_Practice_Transcription_Audio_4min works well and matches the naming pattern of your other sources.","Decide which transcription route to test first. For the automated service, go to the Modules tab on the ribbon, open Transcription, click Add or Add Files, browse to your converted audio file, choose English as the spoken language, and click Transcribe, this panel uploads the file directly and does not require it to be imported as a source first. For the manual route instead, bring the file in through Import Files like any other source, then double click it, switch Play Mode to Transcribe on the Audio tab, and work through it by hand.","When NVivo asks whether to create a case for this file, choose no or skip. This recording is not a new respondent, it is you reading combined excerpts from cases you already created, so a case here would only clutter your case structure. If you want to keep it visually separate, move it into its own folder such as Practice, Transcription Exercise, with a short description noting that it is read aloud practice audio, not a new respondent.","Once you have a transcript back, compare it line by line against the script you read from. Note, in a memo, the accuracy you observed and the correction time it took, since requiring this same comparison habit from your own students is what turns transcription from a black box into a defensible methods step.","If time allows, repeat the process with the other transcription route so you have tried both manual and automated on the same clip, and can speak to the tradeoffs firsthand when you teach this module."]},quiz:[{q:"What happens to audio sent to NVivo Transcription after processing?",options:["It is kept indefinitely","It is automatically deleted ninety days after transcription or last edit","It is deleted immediately after upload","It is shared with other users"],correct:1},{q:"Does transcribing a recording automatically code its text into your node scheme?",options:["Yes, transcription and coding are the same act","No, transcription only produces text; coding is a separate, deliberate step","Only for video files","Only when using the automated service"],correct:1}]},{id:"m3",num:"04",track:"core",title:"Coding Fundamentals",subtitle:"Nodes, cases, in vivo coding, and hierarchy design",time:"1.5 hr",objectives:["Create a defensible parent/child node hierarchy","Code the same passage at multiple nodes appropriately","Use in vivo coding and explain when it adds value"],sections:[{heading:"Designing a coding scheme, not just a list of tags",blocks:[{type:"p",text:"A flat list of forty codes is unusable at analysis time. Build hierarchy deliberately: broad parent nodes representing your conceptual framework (for example, the three P.O.T domains, Personal Mastery, Organising Skills, Taking Action), with child nodes capturing the specific manifestations your data actually shows. This is also where you decide, and document, whether you are coding deductively (from an existing framework), inductively (emergent from the data), or both, a distinction every researcher needs to be able to defend under close questioning."},{type:"list",items:["Deductive nodes: pre set from theory or a program logic model (e.g. P.O.T domains).","Inductive nodes: created as they emerge from a first read through.","In vivo nodes: named using the participant's own words, powerful for capturing local terminology or idiom, but should be a minority of your scheme, not its backbone."]}]},{heading:"Coding stripes and multiple coding",blocks:[{type:"p",text:"Coding stripes (the coloured margin bars in Detail View) let you and your students see coding density and overlap at a glance, which passages are richly coded, which are thin, and where two codes co occur. A single passage coded at multiple nodes is normal and often analytically important (e.g. a quote that is simultaneously about 'confidence' and 'resistance to family pressure'); over coding everything at everything is not."}]}],practice:{title:"Code a transcript excerpt",steps:["Click Codes in Navigation View, then right click in the empty list area and choose New Code, or New Node depending on your version. Name it after a top level theme relevant to your own work, for example Economic Inclusion.","Right click that new node and choose New Child Node, repeat this twice to add two children underneath it, for example Access to Credit and Market Participation, building a three level structure with the parent, the children, and the source text you will code beneath them.","Double click one of your imported transcripts to open it in Detail View. Select a passage of text with your mouse.","With the passage selected, either drag it directly onto the node you want in the Codes list, or right click the selection and choose Code Selection, then pick the node from the list that appears.","Deliberately select one more passage that fits under two different themes, and code it at both nodes, one after the other, this is normal and often analytically important.","On the ribbon, click the View tab, then Coding Stripes, then choose Nodes Most Coding or Selected Items, so the colored stripes appear in the margin next to your coded passages.","Take a screenshot of the coded transcript with stripes visible, this doubles as a ready made teaching slide for showing students what coding density looks like."]},quiz:[{q:"A node named directly using a participant's own phrase is called:",options:["A parent node","An in vivo node","A classification","A case node"],correct:1},{q:"Is coding one passage at two different nodes generally a problem?",options:["Yes, always avoid it","No, it's often analytically meaningful when done deliberately","Only in quantitative datasets","Only for PDF sources"],correct:1}]},{id:"m4",num:"05",track:"core",title:"Cases, Classifications & Attributes",subtitle:"Where NVivo becomes a genuine mixed methods tool",time:"1 hr",objectives:["Build a case classification sheet with demographic attributes","Import classification data from Excel rather than entering it by hand","Explain to students why this step matters for demographic and evaluation research"],sections:[{heading:"Cases as your unit of analysis",blocks:[{type:"p",text:"A Case in NVivo is whoever or whatever you want to compare, usually a respondent, but it can be a site, a district, or a cohort. Classification sheets attach structured attributes (age, sex, region, education, program wave) to each case. This is precisely the bridge between qualitative depth and demographic breadth: once attributes are attached, you can ask NVivo to compare coding across any attribute value."},{type:"callout",variant:"sage",text:"For your discipline specifically: this is the feature that lets a qualitative evaluation talk to a demographic dataset in the same project. A classification sheet is functionally a mini case level dataset sitting inside your qualitative project."}]},{heading:"Importing attributes at scale",blocks:[{type:"p",text:"Rather than typing attributes case by case, prepare a spreadsheet with one row per case and one column per attribute, then import it as classification data matched by case name. For a 100 participant program like Girls Lead with Data, this is the only realistic approach, manual entry invites transcription error and does not scale for teaching either."}]}],practice:{title:"Build a classification sheet",steps:["In Excel, create one row per participant and one column per attribute, Case Name, Age, Sex, District, Education level, and Program wave, for eight to ten mock participants, save the file.","On the ribbon, click Import, then Import Dataset or Import Survey. Browse to your spreadsheet and select it.","In the import preview screen, confirm the Case Name column is recognized as the identifying field, this is what tells NVivo to create a case for each row and attach the remaining columns as attributes.","If you are asked to create or match a classification, choose New Classification the first time, name it something like Respondent, and confirm.","Once the import finishes, click Cases in Navigation View, you should see one case per spreadsheet row.","Click any case, then look for a Classification Sheet or Attribute view (often available by right clicking the Cases folder and choosing Open Classification Sheet), confirm the Age, Sex, District, Education level, and Program wave columns are all populated correctly.","In List View, try sorting or filtering the Cases list by one attribute column, for example District, to confirm the classification data is genuinely usable for comparison, not just stored."]},quiz:[{q:"What is the main analytical benefit of attaching classifications to cases?",options:["Faster PDF import","Comparing coding patterns across demographic groups","Automatic translation","Removing duplicate sources"],correct:1},{q:"For a 100 participant program, the recommended way to attach attributes is:",options:["Manual entry per case","Importing a spreadsheet matched by case name","Using in vivo coding","Using Sets instead"],correct:1}]},{id:"m5",num:"06",track:"advanced",title:"Matrix Tools & Coding Comparison",subtitle:"Framework Matrices, AI assisted summaries, and inter coder reliability",time:"1.5 hr",objectives:["Build and populate a Framework Matrix","Use AI generated summaries in a Framework Matrix cell responsibly","Run a Coding Comparison Query and interpret kappa coefficients"],sections:[{heading:"Framework Matrices",blocks:[{type:"p",text:"A Framework Matrix is a row by column grid, typically cases down the rows and themes across the columns, used to summarize coded material case by case. It is the digital, scalable descendant of the classic 'framework analysis' matrix familiar from applied policy research. As of NVivo 15.3 this is available on both Windows and Mac, and cells can be populated with an AI generated summary of the coded material, which you can then edit before saving."},{type:"callout",variant:"rose",text:"Treat AI summaries in matrix cells as a first draft only, never a final analytic statement. Always check the summary against the underlying coded text in the side by side preview before accepting it, a habit worth making mandatory, not optional, in any course you teach."}]},{heading:"Coding Comparison for team reliability",blocks:[{type:"p",text:"When multiple people code the same material (as with a five person evaluation team), a Coding Comparison Query quantifies agreement between coders, reporting percentage agreement and Cohen's kappa per node. This is directly relevant to any multi evaluator assignment: running and reporting a coding comparison is standard practice for demonstrating coding reliability in a methodology section or annex."}]}],practice:{title:"Reliability drill",steps:["On the Navigation View, click on Notes, then Framework Matrices, then New Framework Matrix.","Add three cases as rows and three of your coded themes as columns, using the Add or Select buttons in the setup dialog, then click OK to generate the empty grid.","Click into one cell where a case and a theme intersect. Look for a Summarize or AI Summary option, often available by right clicking the cell or through an AI icon in that toolbar, and generate a summary of the coded material for that case and theme.","Open the source preview alongside the cell, read the underlying coded text, and manually edit the AI generated summary so it accurately reflects what is actually there before you consider the cell finished.","If a colleague is available, have each of you independently code the same shared transcript against your existing node scheme, without comparing notes first.","On the ribbon, click Explore, then Coding Comparison Query. Select yourself and your colleague as the two users being compared, select the nodes to include, and run the query.","Review the percentage agreement and Cohen's kappa reported for each node, and talk through together what a low kappa on any particular node suggests about a definitional disagreement worth resolving before full rollout."]},quiz:[{q:"What statistic does a Coding Comparison Query report to quantify inter coder agreement?",options:["R squared","Cohen's kappa","Standard deviation","Chi square"],correct:1},{q:"How should an AI generated Framework Matrix summary be treated?",options:["As final analytic text, ready to publish","As a draft to verify against the source before accepting","As unnecessary and always ignored","As a replacement for coding"],correct:1}]},{id:"m6",num:"07",track:"advanced",title:"Queries: Interrogating Your Data",subtitle:"Text search, coding queries, and the new crosstab statistics",time:"1.5 hr",objectives:["Run text search, word frequency, coding, and matrix queries","Use Crosstab Query descriptive statistics and box plots","Build a compound (Boolean) query combining code and attribute"],sections:[{heading:"The core query types",blocks:[{type:"list",items:["Text Search: finds a word or phrase and its surrounding context across sources.","Word Frequency: surfaces the most common terms, often a useful first pass exploratory step, visualized as a word cloud or tree.","Coding Query: retrieves everything coded at a node (or combination of nodes), optionally filtered by case attribute.","Matrix Query: cross tabulates nodes by attributes or by other nodes, producing a grid of coding references."]}]},{heading:"Crosstab statistics, new in 15.3",blocks:[{type:"p",text:"The Crosstab Query now returns descriptive statistics, mean, median, quartiles, and standard deviation, alongside a Box Plot tab showing distribution and variation across groups. This narrows the gap that used to force researchers out to SPSS or Excel just for a basic distributional comparison of coding density across groups, and it's a genuinely useful addition for a mixed methods audience."},{type:"callout",variant:"amber",text:"Worth teaching explicitly: this does not turn NVivo into a statistics package. It gives you enough descriptive insight to decide whether a pattern is worth formal quantitative follow up elsewhere."}]}],practice:{title:"Run a comparative query",steps:["On the ribbon, click Explore, then Queries, then Coding Query.","Under Coding Criteria, select one theme node. Under Selection Criteria or Advanced, add a filter for a case attribute, for example District equals a specific value, then click Run.","Review the results list, confirming only cases matching that attribute value are included.","On the ribbon, click Explore, then Queries, then Crosstab Query.","Set your theme node as the row and a case attribute, for example District or Age band, as the column, then click Run.","In the results window, click the Statistics tab to see mean, median, quartiles, and standard deviation, then click the Box Plot tab to see the distribution visually across your groups.","In a memo, write one sentence interpreting the distributional difference you see, being explicit that a crosstab shows a descriptive pattern, not a statistically tested claim, and that any real difference would need a proper quantitative follow up to confirm."]},quiz:[{q:"Which NVivo 15.3 addition lets you see mean, median, quartiles and standard deviation directly in a query result?",options:["Word Frequency Query","Crosstab Query","Text Search Query","AI Assistant"],correct:1},{q:"A Matrix Query is best described as:",options:["A single node text retrieval","A cross tabulation of nodes by attributes or other nodes","A video coding tool","A case classification importer"],correct:1}]},{id:"m7",num:"08",track:"advanced",title:"Visualizing Findings",subtitle:"Word clouds, word trees, cluster analysis, models, and PCA",time:"1 hr",objectives:["Produce and interpret a word tree and a cluster analysis","Build a model diagram linking codes conceptually","Know when PCA is appropriate and its platform limitation"],sections:[{heading:"From coded text to visual argument",blocks:[{type:"list",items:["Word Clouds & Word Trees: fast exploratory visuals showing frequency and the syntactic context around a term, good for early presentations to stakeholders, weak as standalone evidence.","Cluster Analysis: groups sources or nodes by similarity of words or coding patterns, genuinely useful for spotting unexpected groupings across cases.","Models: freeform diagrams linking codes, cases, and ideas, this is where a conceptual framework like P.O.T can be drawn out visually with its interconnections made explicit.","PCA (Principal Component Analysis, Windows only): a data reduction visualization typically applied to correlated continuous variables, most relevant when your classification sheet has several numeric attributes you want to explore for underlying structure."]}]},{heading:"Choosing a visual for a purpose, not for decoration",blocks:[{type:"p",text:"Every visualization should answer a specific question. 'What does this program's alumni network look like across two countries' is a model. 'Do coding patterns differ between two cohorts' is a cluster analysis or crosstab, not a word cloud. Teaching students to name the question before picking the visual prevents decorative, evidence free charts creeping into dissertations."}]}],practice:{title:"Build one diagnostic and one explanatory visual",steps:["On the ribbon, click Explore, then Cluster Analysis.","Choose Cases as the item type, and Coding Similarity as the comparison basis, then click Run.","Study the resulting dendrogram or cluster map, and note in a memo any groupings that surprise you, cases you expected to cluster together that did not, or vice versa.","On the ribbon, click Explore, then Models, then New Model.","Drag your top level nodes onto the blank canvas, one for each domain in your conceptual framework, for example the three P.O.T domains.","Drag each domain's child nodes onto the canvas as well, then use the Link or Connector tool to draw lines between related items, labeling each link with a short phrase describing the relationship.","Save the model with a clear name, this diagram is genuinely reusable as a teaching slide for explaining your framework to students or stakeholders."]},quiz:[{q:"PCA visualization in NVivo 15 is currently available on:",options:["Windows only","Mac only","Both platforms equally","Neither platform"],correct:0},{q:"Which tool is best suited to spotting unexpected groupings of cases by coding similarity?",options:["Word Cloud","Cluster Analysis","Text Search Query","Case Classification"],correct:1}]},{id:"m8",num:"09",track:"advanced",title:"AI Assistant, Autocoding & Ethics",subtitle:"Using AI responsibly in qualitative coding, and teaching it responsibly",time:"1.5 hr",objectives:["Use AI Assistant summarization and sentiment analysis appropriately","Explain autocoding versus manual coding, and when pattern based autocoding is defensible","Articulate the data privacy and IRB implications of AI features to a class"],sections:[{heading:"What the AI Assistant does",blocks:[{type:"list",items:["Summarization: condenses a selected passage, a whole document, or a case into a short summary, saved as an editable annotation or memo.","Sentiment Analysis: assigns emotional tone (positive/negative/mixed) across sources, useful for a first pass scan of large volumes of open ended survey or social media text.","Autocoding (pattern based): extends your existing manual coding to uncoded material by learning from the patterns you've already established, rather than coding from a blank slate.","Suggest Child Codes: proposes finer grained child nodes under a parent you've already created."]}]},{heading:"Data privacy and governance",blocks:[{type:"p",text:"Text sent to the AI Assistant is processed and then deleted from Lumivero's servers once the task completes, with no retention. Institutions with strict IRB, ethics, or data sovereignty requirements can disable AI features entirely at the administrator level while keeping full access to core QDA tools. For your own teaching context, this is worth stating explicitly on day one: any project containing identifiable participant data governed by an ethics protocol that predates AI assisted tools should have AI features either disabled or used only on de identified extracts, until your institution's ethics board has explicitly cleared their use."},{type:"callout",variant:"rose",text:"A pedagogical point worth building into assessment criteria: a student who cannot distinguish their own interpretive coding from an AI suggested code has not learned to code. Require justification memos for any AI suggested code a student accepts."}]}],practice:{title:"Critically test the AI Assistant",steps:["Open one of your imported transcripts, select a substantial passage or the whole document, right click, and look for a Summarize or AI Assistant option, or check the Modules tab on the ribbon for an AI Assistant panel.","Generate the summary, then read the original passage closely yourself and compare it sentence by sentence against what the AI produced, noting in a memo any distortions, omissions, or overconfident claims.","Select a small batch of open ended survey responses if you have them, or use a few lines from your mock transcripts, and run Sentiment Analysis on them through the same AI Assistant panel.","Manually read three of the sentiment results against the original text and judge whether the assigned tone, positive, negative, or mixed, actually matches your own reading.","Draft a short, one paragraph AI use disclosure, stating plainly which AI features you used, on what material, and how you validated the output, this is the paragraph you would place in a methodology section or hand to students as a required template for their own work."]},quiz:[{q:"What happens to data sent to the NVivo AI Assistant after a task completes?",options:["It is stored indefinitely for model training","It is deleted from servers with no retention","It is shared with third parties","It is automatically published"],correct:1},{q:"Pattern based autocoding works by:",options:["Coding from a completely blank slate using only AI judgment","Extending your existing manual coding patterns to uncoded material","Replacing the need for a node hierarchy","Only functioning on audio files"],correct:1}]},{id:"m9",num:"10",track:"advanced",title:"Collaboration & Team Projects",subtitle:"Collaboration Cloud, Collaboration Server, and multi coder workflows",time:"1 hr",objectives:["Distinguish Collaboration Cloud from an on premise Collaboration Server","Design a coding protocol for a multi person evaluation team","Merge or reconcile work from multiple team members"],sections:[{heading:"Two collaboration models",blocks:[{type:"list",items:["Collaboration Cloud: Lumivero hosted, real time teamwork on a shared project, simplest to set up, no institutional IT involvement required.","Collaboration Server: institution hosted, keeping all data inside the university or organisation's own IT environment, the appropriate choice where data security policy or an IRB requires data stay on internal infrastructure."]},{type:"p",text:"For a team like a five person evaluation squad spread across roles and geographies, agreeing which model to use, and who owns final merge authority, should happen in the inception phase, not discovered mid analysis."}]},{heading:"A workable team coding protocol",blocks:[{type:"list",items:["Freeze the node hierarchy after a pilot coding round, and version it (e.g. 'coding scheme v2, approved 20 Jul').","Assign named coding responsibility per source or per case, not open free for all coding.","Run a Coding Comparison Query after the pilot round, before full rollout, to catch definitional drift early.","Log any node hierarchy changes centrally so no one codes against a stale scheme."]}]}],practice:{title:"Draft a team protocol",steps:["Open the File menu and look for a Collaborate, Team, or Cloud option, this is where NVivo lets you either connect to Collaboration Cloud or point to an institutional Collaboration Server, explore what setup information each option asks for without committing to either yet.","For a hypothetical, or real, five person team, decide between Collaboration Cloud and an institution hosted Collaboration Server, and write two sentences justifying the choice based on your data sensitivity and whether your institution's IT department can host a server.","Write a one page coding protocol document covering three things clearly, the point at which the node hierarchy gets frozen and versioned, who is assigned to code which sources or cases, and when a Coding Comparison Query will be run to check reliability before full rollout.","Share that one page protocol with a colleague if possible, and ask them to point out anything ambiguous, an unclear protocol on paper usually surfaces as inconsistent coding in practice."]},quiz:[{q:"Which collaboration option keeps all project data on an institution's own servers?",options:["Collaboration Cloud","Collaboration Server","NCapture","Framework Matrix"],correct:1},{q:"When should a team's node hierarchy generally be frozen and versioned?",options:["Never, it should always stay fully open","After a pilot coding round, before full team rollout","Only after the final report is submitted","Immediately on project creation, with no pilot"],correct:1}]},{id:"m10",num:"11",track:"advanced",title:"Reporting, Outputs & Writing Up",subtitle:"Turning coded data into methodology sections and findings tables",time:"1 hr",objectives:["Export a query result or matrix as a usable table for a report","Write a methodology paragraph that accurately describes an NVivo based workflow","Use memos and annotations as an audit trail"],sections:[{heading:"From project to page",blocks:[{type:"p",text:"Reports, matrix exports, and coding summaries can be exported to Word or Excel for direct use in a findings chapter or annex. The habit worth instilling is exporting with enough metadata (query parameters, date run, coder) that the table is reproducible months later, a frequent weak point in student dissertations."},{type:"callout",variant:"sage",text:"A defensible methodology paragraph names: the software and version ('NVivo 15'), the coding approach (deductive/inductive/hybrid), how reliability was established (e.g. Cohen's kappa from a Coding Comparison Query), and whether AI assisted features were used and how they were validated."}]},{heading:"Memos as your paper trail",blocks:[{type:"p",text:"Memos (project level reflective notes) and annotations (attached to specific passages) are where analytic decisions get documented in real time. Require students to keep a running analytic memo from week one; retrofitting a decision trail at the end of a project is close to impossible and a common cause of lost marks in methodology defenses."}]}],practice:{title:"Produce one exportable output",steps:["Open a Matrix Query or Framework Matrix result you have already built earlier in the course.","Right click inside the results grid and look for an Export Results option, choose Excel or Word as the format, and save it somewhere you can find again.","Open the exported file and check that row and column labels came through clearly enough that someone outside the project could understand the table without extra explanation.","Draft a four to six sentence methodology paragraph naming the software and version, NVivo 15, your coding approach, deductive, inductive, or hybrid, how reliability was established, citing your Coding Comparison kappa result if you ran one, and whether AI assisted features were used and how they were validated."]},quiz:[{q:"What should a defensible methodology paragraph explicitly name regarding AI use?",options:["Nothing, AI use doesn't need disclosure","Whether AI assisted features were used and how they were validated","Only the software's price","The researcher's personal opinion of AI"],correct:1},{q:"What is the main risk of not keeping running analytic memos throughout a project?",options:["Slower PDF import","An undocumented, hard to reconstruct decision trail at write up time","Loss of case classifications","Reduced word cloud accuracy"],correct:1}]},{id:"m11",num:"12",track:"capstone",title:"Capstone: Your Own Dataset, End to End",subtitle:"Run the full workflow once, start to finish, on real material",time:"3+ hr",objectives:["Execute the complete NVivo workflow on a real project strand","Produce one finished, presentable output (matrix, model, or report)","Identify which steps you'd do differently with a full research team"],sections:[{heading:"Why a capstone, not another exercise",blocks:[{type:"p",text:"Every prior module used small excerpts deliberately, to isolate one skill at a time. Mastery, and the ability to teach mastery, only shows up when you run the full chain yourself: import, organize, classify, code, query, visualize, and write up, on material with real stakes. Use an actual strand of your own live project for this, not a toy dataset."}]},{heading:"Suggested capstone scope",blocks:[{type:"list",items:["Import 5 to 10 real (or realistically de identified) sources plus one classification spreadsheet.","Build and apply a coding scheme tied to an actual framework you use, such as the P.O.T domains or the GLD SDG alignment structure.","Run at least one Coding Comparison, one Crosstab Query, and one visualization.","Produce one exported output fit to show a donor, supervisor, or student cohort."]}]}],practice:{title:"Ship one real artifact",steps:["Using Import Files and Import Dataset on the ribbon, bring five to ten real, or realistically de identified, sources plus one classification spreadsheet into this project.","Build and apply your coding scheme, using New Code and New Child Node as in Module 04, tied to a real framework you use, such as the P.O.T domains or the GLD SDG alignment structure.","Run at least one Coding Comparison Query, one Crosstab Query, and one visualization, Model or Cluster Analysis, using the same ribbon paths covered in earlier modules.","Export one finished output, a Framework Matrix, a Crosstab result, or a Model image, to a format fit to show a donor, supervisor, or student cohort.","Write a half page reflection noting which steps took the longest for you personally, and where a five person team would need the clearest shared protocol to avoid the same slowdown."]},quiz:[{q:"Why does the capstone deliberately use real project material instead of another isolated exercise?",options:["Real data is required by NVivo's licence","Mastery and teaching readiness only surface when the full workflow is run end to end on real stakes","Toy datasets are not supported by the trial","It's faster than using sample data"],correct:1}]},{id:"m12",num:"13",track:"capstone",title:"Teaching NVivo Effectively",subtitle:"Syllabus design, assessment, and the mistakes every cohort makes",time:"2 hr",objectives:["Draft a session by session syllabus outline for a taught NVivo course","Design assessment that tests judgment, not just button clicking","Anticipate the most common student errors and pre empt them"],sections:[{heading:"A syllabus skeleton you can adapt",blocks:[{type:"list",items:["Weeks 1 to 2: QDA foundations, workspace orientation, ethics of qualitative data handling and AI disclosure (Modules 0 to 1).","Weeks 3 to 4: Import, organization, and coding fundamentals, with a graded pilot coding exercise (Modules 2 to 3).","Weeks 5 to 6: Classifications and mixed methods integration, this week should include their own real or simulated demographic dataset (Module 4).","Weeks 7 to 8: Matrix tools, coding comparison, and queries, culminating in a team reliability exercise (Modules 5 to 6).","Weeks 9 to 10: Visualization and AI assisted tools, with mandatory critical evaluation write ups for any AI output used (Modules 7 to 8).","Weeks 11 to 12: Collaboration protocols and reporting, then a capstone project presented to the cohort (Modules 9 to 11)."]}]},{heading:"Assessing judgment, not clicks",blocks:[{type:"p",text:"The weakest NVivo assessments ask students to demonstrate they clicked the right button. The strongest ask students to justify a choice: why this node hierarchy and not a flatter one, why this case was excluded from a crosstab, why an AI suggested code was accepted or rejected. Build rubrics around justification memos, not screenshots."},{type:"callout",variant:"amber",text:"Common cohort mistakes worth pre empting explicitly: (1) treating Sets and Folders as interchangeable and losing track of their project structure by week 4; (2) coding everything at the most granular level with no parent hierarchy, producing an unusable 60 node flat list; (3) accepting AI summaries or suggested codes without checking them against source text; (4) never running a Coding Comparison until the very end, when it's too late to correct drift."}]}],practice:{title:"Draft your own syllabus",steps:["Open a blank document and copy in the twelve week skeleton from this module, then adjust the week count and pacing to match your actual course length and your cohort.","For each week, write one sentence naming the specific NVivo skill and the specific piece of your students' own data they will practice it on, a syllabus grounded in real practice sticks better than one built around generic exercises.","Write two full assessment items that explicitly require a justification memo, not a screenshot, one testing a coding scheme decision and one testing an AI use decision.","List the three mistakes you most expect your specific cohort to make, based on their disciplinary background and prior software exposure, and write one sentence next to each naming exactly when in the term you will pre empt it."]},quiz:[{q:"What distinguishes a strong NVivo assessment from a weak one, per this module?",options:["Weak assessments require more screenshots","Strong assessments require justification for analytic choices, not just demonstration of clicks","Strong assessments avoid all group work","Weak assessments use more case studies"],correct:1},{q:"Which is listed as a common early student mistake?",options:["Using too few sources","Treating Sets and Folders as interchangeable","Running Coding Comparison too early","Overusing classification sheets"],correct:1}]}],qg=["foundations","core","advanced","capstone"];function jg(){let[t,e]=(0,_t.useState)({}),[a,l]=(0,_t.useSta (function(){
  "use strict";

  var GOOGLE_FORM_ACTION = "https://script.google.com/macros/s/AKfycbyKvSYTyZb2fXG7dUsJU2jxKi-DgJA4HkbotXj-HTylNDmm7M8yi9By0oychy-Y6sS1/exec";
  var VERIFY_TIMEOUT_MS = 8000;
  var TELECEL_CASH_NUMBER = "+233 50 684 3406";
  var TELECEL_ACCOUNT_NAME = "DataEdge Insights Ghana/Efua Kwaambaa Turkson";
  var SUBSCRIPTION_PRICE_USD = 10;

  var hasNativeStorage = (typeof window.storage !== 'undefined') && window.storage && typeof window.storage.get === 'function';

  // Access grants go to sessionStorage, which the browser clears when it
  // closes, so the access code must be entered again each session. Everything
  // else, including the month-long subscription grant and course progress,
  // stays in localStorage.
  function storeFor(key){
    try{
      return (key.indexOf('access-grant') !== -1) ? window.sessionStorage : window.localStorage;
    }catch(e){ return window.localStorage; }
  }

  var appStorage = hasNativeStorage ? window.storage : {
    get: function(key, shared){
      return new Promise(function(resolve){
        var k = 'nvivo_' + (shared ? 'shared:' : 'user:') + key;
        var v = storeFor(key).getItem(k);
        resolve(v !== null ? {key:key, value:v, shared:shared} : null);
      });
    },
    set: function(key, value, shared){
      return new Promise(function(resolve){
        var k = 'nvivo_' + (shared ? 'shared:' : 'user:') + key;
        storeFor(key).setItem(k, value);
        resolve({key:key, value:value, shared:shared});
      });
    }
  };

  function el(html){
    var d = document.createElement('div');
    d.innerHTML = html.trim();
    return d.firstElementChild;
  }
  function esc(s){
    return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }
  async function sha256(str){
    var buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
    return Array.from(new Uint8Array(buf)).map(function(b){ return b.toString(16).padStart(2,'0'); }).join('');
  }

  function submitForm(payload){
    return new Promise(function(resolve){
      try{
        var iframeName = "nvivo_submit_" + Date.now();
        var iframe = document.createElement('iframe');
        iframe.name = iframeName;
        iframe.style.display = 'none';
        document.body.appendChild(iframe);

        var form = document.createElement('form');
        form.action = GOOGLE_FORM_ACTION;
        form.method = 'POST';
        form.target = iframeName;
        form.style.display = 'none';

        Object.keys(payload).forEach(function(k){
          var input = document.createElement('input');
          input.type = 'hidden';
          input.name = k;
          input.value = payload[k] || "";
          form.appendChild(input);
        });

        document.body.appendChild(form);
        form.submit();

        setTimeout(function(){
          form.remove();
          iframe.remove();
          resolve(true);
        }, 800);
      }catch(e){
        console.error("NVivo platform submit error:", e);
        resolve(false);
      }
    });
  }

  function verifyCodeJSONP(action, code){
    // Originally used <script src> JSONP, but that's silently blocked by
    // some browsers' tracking-prevention features for dynamically-injected
    // cross-origin scripts. Plain fetch() GET is reliable here instead.
    var url = GOOGLE_FORM_ACTION
      + "?action=" + encodeURIComponent(action)
      + "&code=" + encodeURIComponent(code);
    // A request that never settles used to hang start-up forever, leaving a
    // blank screen, so it is abandoned after VERIFY_TIMEOUT_MS.
    var ctl = (typeof AbortController !== "undefined") ? new AbortController() : null;
    var timedOut = false;
    var timer = setTimeout(function(){ timedOut = true; if(ctl){ try{ ctl.abort(); }catch(e){} } }, VERIFY_TIMEOUT_MS);
    return fetch(url, ctl ? {signal: ctl.signal} : undefined)
      .then(function(r){ return r.text(); })
      .then(function(text){
        clearTimeout(timer);
        try{ return JSON.parse(text); }
        catch(e){ return {valid:false, reason:"parse_error"}; }
      })
      .catch(function(err){
        clearTimeout(timer);
        console.error("Verify request error:", err);
        return {valid:false, reason: timedOut ? "timeout" : "network"};
      });
  }

  var COUNTRY_OPTIONS = ["Afghanistan","Albania","Algeria","Andorra","Angola","Argentina","Australia","Austria","Bangladesh","Belgium","Benin","Botswana","Brazil","Burkina Faso","Cameroon","Canada","Chad","China","Cote d'Ivoire","Denmark","Egypt","Ethiopia","Finland","France","Gabon","Gambia","Germany","Ghana","Guinea","India","Indonesia","Ireland","Italy","Japan","Kenya","Liberia","Malawi","Mali","Mexico","Morocco","Mozambique","Namibia","Netherlands","Niger","Nigeria","Norway","Pakistan","Philippines","Rwanda","Senegal","Sierra Leone","South Africa","South Korea","South Sudan","Spain","Sweden","Switzerland","Tanzania","Togo","Uganda","United Kingdom","United States","Zambia","Zimbabwe","Other"];

  var gateState = { tab: 'request', error: null, submitted: false, checking: false };
  var accessGranted = false;

  function styleTag(){
    return '<style>'
      + '.nvg-wrap{max-width:520px;margin:60px auto;padding:0 20px;font-family:"DM Sans",system-ui,sans-serif;}'
      + '.nvg-card{background:#F3ECDD;border:1px solid #10263F22;border-radius:8px;padding:34px 32px;box-shadow:0 10px 40px rgba(14,31,56,0.12);}'
      + '.nvg-card h2{font-family:"Cormorant Garamond",serif;font-size:26px;color:#10263F;text-align:center;margin:0 0 4px 0;}'
      + '.nvg-sub{text-align:center;color:#454B58;font-size:13.5px;margin-bottom:22px;}'
      + '.nvg-card label{display:block;font-size:12.5px;font-weight:600;color:#10263F;margin:14px 0 4px;}'
      + '.nvg-card input,.nvg-card select,.nvg-card textarea{width:100%;box-sizing:border-box;padding:9px 11px;border:1px solid #10263F33;border-radius:5px;font-size:14px;font-family:inherit;background:#fff;}'
      + '.nvg-btnrow{display:flex;gap:10px;margin-top:22px;}'
      + '.nvg-btn{flex:1;padding:11px 16px;border-radius:6px;font-size:14.5px;font-weight:600;cursor:pointer;border:none;text-align:center;}'
      + '.nvg-btn-primary{background:#10263F;color:#F3ECDD;}'
      + '.nvg-btn-secondary{background:transparent;color:#10263F;border:1.5px solid #10263F44;}'
      + '.nvg-errbox{background:#B0524A18;border:1px solid #B0524A;color:#7A2D1D;padding:10px 12px;border-radius:5px;font-size:13px;margin-top:12px;}'
      + '.nvg-terms-row{display:flex;gap:9px;align-items:flex-start;margin:14px 0 4px;cursor:pointer;font-size:12.5px;line-height:1.55;color:#E6DCC6;}'
      + '.nvg-terms-row input{margin-top:2px;width:15px;height:15px;accent-color:#3F7A5A;cursor:pointer;flex-shrink:0;}'
      + '.nvg-terms-row a{color:#9BD3B4;text-decoration:underline;}'
      + '.nvg-fieldnote{font-family:"DM Mono",monospace;font-size:10.5px;color:#454B58;margin-top:12px;text-align:center;}'
      + '.nvg-fieldnote a{color:#C68A2E;cursor:pointer;}'
      + '.nvg-success{text-align:center;padding:20px 10px;}'
      + '.nvg-check{font-size:40px;color:#3F7A5A;margin-bottom:10px;}'
      + '.nvg-pay-box{background:#FFF4E5;border:1px solid #E8C48A;border-radius:6px;padding:16px 18px;margin-bottom:18px;font-size:13.5px;line-height:1.6;}'
      + '.nvg-pay-box p{margin:0 0 8px;}'
      + '.nvg-overlay{position:fixed;inset:0;background:rgba(16,38,63,0.55);z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px;overflow-y:auto;}'
      + '.nvg-overlay .nvg-wrap{margin:20px auto;}'
      + '.nvg-reset{position:fixed;bottom:16px;right:16px;z-index:9998;background:#10263F;color:#F3ECDD;border:1px solid #F3ECDD33;border-radius:6px;padding:8px 13px;font-family:"DM Mono",monospace;font-size:11px;letter-spacing:0.04em;text-transform:uppercase;cursor:pointer;opacity:0.72;}'
      + '.nvg-reset:hover{opacity:1;background:#B0524A;border-color:#B0524A;}'
      + '</style>';
  }

  function renderRegistrationGate(container){
    container.innerHTML = styleTag() + '<div class="nvg-wrap"><div class="nvg-card">'
      + '<h2>DataEdge Course Studio: NVivo 15</h2>'
      + '<div class="nvg-sub">Request access below, or enter a code if you already have one.</div>'
      + '<div id="nvg-body"></div>'
      + '</div><div class="nvg-fieldnote" style="margin-top:12px;">&copy; ' + new Date().getFullYear() + ' DataEdge Insights Ghana.</div></div>';
    renderGateBody(document.getElementById('nvg-body'));
  }

  function renderGateBody(body){
    if(gateState.tab === 'code'){
      body.innerHTML = ''
        + '<label>Name</label><input id="nvg-name" type="text" placeholder="Your full name">'
        + '<label>Access code</label><input id="nvg-code" type="text" placeholder="Enter the code you were given">'
        + (gateState.error ? '<div class="nvg-errbox">' + esc(gateState.error) + '</div>' : '')
        + '<div class="nvg-btnrow"><button class="nvg-btn nvg-btn-primary" id="nvg-submit" style="width:100%;">' + (gateState.checking ? 'Checking...' : 'Enter') + '</button></div>'
        + '<div class="nvg-fieldnote"><a id="nvg-back">Back to registration</a></div>';
      document.getElementById('nvg-submit').addEventListener('click', onCodeSubmit);
      document.getElementById('nvg-code').addEventListener('keydown', function(e){ if(e.key === 'Enter') onCodeSubmit(); });
      document.getElementById('nvg-back').addEventListener('click', function(){ gateState.tab='request'; gateState.error=null; renderGateBody(body); });
      return;
    }

    if(gateState.submitted){
      body.innerHTML = '<div class="nvg-success"><div class="nvg-check">&#10003;</div>'
        + '<p>Thank you for registering. Your request has been recorded. If your registration is approved, you will receive an access code by email.</p></div>';
      return;
    }

    body.innerHTML = ''
      + '<label>Name</label><input id="nvg-name" type="text" placeholder="Your full name">'
      + '<label>Email</label><input id="nvg-email" type="text" placeholder="you@example.com">'
      + '<label>What do you need the course for?</label><textarea id="nvg-purpose" rows="3" placeholder="e.g. Preparing to teach NVivo at graduate level"></textarea>'
      + '<label>Country</label><select id="nvg-country"><option value="">Select...</option>' + COUNTRY_OPTIONS.map(function(c){ return '<option value="'+esc(c)+'">'+esc(c)+'</option>'; }).join('') + '</select>'
      + '<label class="nvg-terms-row" for="nvg-terms">'
        + '<input type="checkbox" id="nvg-terms">'
        + '<span>I have read and agree to the <a href="../tools-terms.html" target="_blank" rel="noopener">Terms &amp; Conditions</a> of the Digital Tool Suite.</span>'
      + '</label>'
      + (gateState.error ? '<div class="nvg-errbox">' + esc(gateState.error) + '</div>' : '')
      + '<div class="nvg-btnrow"><button class="nvg-btn nvg-btn-primary" id="nvg-req-submit" style="width:100%;">Send request</button></div>'
      + '<div class="nvg-fieldnote"><a id="nvg-to-code">I already have an access code</a></div>';
    document.getElementById('nvg-to-code').addEventListener('click', function(){ gateState.tab='code'; gateState.error=null; renderGateBody(body); });
    document.getElementById('nvg-req-submit').addEventListener('click', onRegisterSubmit);
  }

  async function onRegisterSubmit(e){
    var name = document.getElementById('nvg-name').value.trim();
    var email = document.getElementById('nvg-email').value.trim();
    var purpose = document.getElementById('nvg-purpose').value.trim();
    var country = document.getElementById('nvg-country').value.trim();
    var termsBox = document.getElementById('nvg-terms');
    var agreed = !!(termsBox && termsBox.checked);
    if(!name || !email || !purpose || !country){
      gateState.error = "Please fill in your name, email, what you need the course for, and your country.";
      renderGateBody(document.getElementById('nvg-body'));
      return;
    }
    if(!agreed){
      gateState.error = "Please read and agree to the Terms & Conditions before sending your request.";
      renderGateBody(document.getElementById('nvg-body'));
      return;
    }
    gateState.error = null;
    e.target.disabled = true; e.target.textContent = "Sending...";
    await submitForm({ formType: "nvivo_registration", name: name, email: email, purpose: purpose, country: country, agreedTerms: "yes", termsVersion: "1.1", agreedAt: new Date().toISOString() });
    gateState.submitted = true;
    renderGateBody(document.getElementById('nvg-body'));
  }

  async function onCodeSubmit(){
    var name = document.getElementById('nvg-name').value.trim();
    var code = document.getElementById('nvg-code').value.trim();
    if(!name){ gateState.error = "Please enter your name."; renderGateBody(document.getElementById('nvg-body')); return; }
    if(!code){ gateState.error = "Please enter your access code."; renderGateBody(document.getElementById('nvg-body')); return; }
    gateState.error = null;
    gateState.checking = true;
    renderGateBody(document.getElementById('nvg-body'));
    var result = await verifyCodeJSONP("verifyNvivoAccess", code);
    gateState.checking = false;
    if(result && result.valid){
      try{ await appStorage.set('nvivo-access-grant', JSON.stringify({name:name, code:code, grantedAt:new Date().toISOString()}), false); }catch(err){}
      startApp();
      return;
    }
    gateState.error = (result && (result.reason === "network" || result.reason === "timeout"))
      ? "Could not reach the server to check that code. Check your connection and try again."
      : "That code wasn't recognized. Check it, or register below instead.";
    renderGateBody(document.getElementById('nvg-body'));
  }

  async function checkExistingAccess(){
    try{
      var rec = await appStorage.get('nvivo-access-grant', false);
      if(!rec) return false;
      var parsed = JSON.parse(rec.value);
      if(!parsed || !parsed.code) return false;
      var result = await verifyCodeJSONP("verifyNvivoAccess", parsed.code);
      // Deliberately fails closed: if the approvals sheet cannot be reached,
      // access is refused rather than assumed. A stored grant is not proof
      // of approval, since the approval may since have been withdrawn.
      return !!(result && result.valid);
    }catch(e){ return false; }
  }

  async function checkExistingSubscription(){
    try{
      var rec = await appStorage.get('nvivo-subscription-grant', false);
      if(!rec) return false;
      var parsed = JSON.parse(rec.value);
      if(!parsed || !parsed.expires) return false;
      if(new Date(parsed.expires) < new Date()) return false;
      window.__nvivoSubscriptionActive = true;
      return true;
    }catch(e){ return false; }
  }

  /* ---------------- subscription paywall ---------------- */
  var payState = { tab: 'pay', error: null, submitted: false, checking: false };

  window.__showNvivoPaywall = function(){
    var existing = document.getElementById('nvg-paywall-overlay');
    if(existing) return;
    payState = { tab: 'pay', error: null, submitted: false, checking: false };
    var overlay = el('<div class="nvg-overlay" id="nvg-paywall-overlay"></div>');
    overlay.innerHTML = styleTag() + '<div class="nvg-wrap"><div class="nvg-card">'
      + '<h2>Unlock Core Skills</h2>'
      + '<div class="nvg-sub">A subscription is required from Core Skills onward. Foundations modules stay free.</div>'
      + '<div id="nvg-pay-body"></div>'
      + '<div class="nvg-fieldnote" style="margin-top:14px;"><a id="nvg-pay-close">Close</a></div>'
      + '</div></div>';
    document.body.appendChild(overlay);
    document.getElementById('nvg-pay-close').addEventListener('click', function(){ overlay.remove(); });
    renderPayBody(document.getElementById('nvg-pay-body'));
  };

  function renderPayBody(body){
    if(payState.tab === 'code'){
      body.innerHTML = ''
        + '<label>Name</label><input id="nvg-p-name" type="text" placeholder="Your full name">'
        + '<label>Subscription code</label><input id="nvg-p-code" type="text" placeholder="Enter the code you were emailed">'
        + (payState.error ? '<div class="nvg-errbox">' + esc(payState.error) + '</div>' : '')
        + '<div class="nvg-btnrow"><button class="nvg-btn nvg-btn-primary" id="nvg-p-submit" style="width:100%;">' + (payState.checking ? 'Checking...' : 'Unlock') + '</button></div>'
        + '<div class="nvg-fieldnote"><a id="nvg-p-back">Back to payment</a></div>';
      document.getElementById('nvg-p-submit').addEventListener('click', onSubCodeSubmit);
      document.getElementById('nvg-p-code').addEventListener('keydown', function(e){ if(e.key === 'Enter') onSubCodeSubmit(); });
      document.getElementById('nvg-p-back').addEventListener('click', function(){ payState.tab='pay'; payState.error=null; renderPayBody(body); });
      return;
    }

    if(payState.submitted){
      body.innerHTML = '<div class="nvg-success"><div class="nvg-check">&#10003;</div>'
        + '<p>Thank you. Your payment reference has been recorded. Once confirmed, you will receive a subscription code by email.</p>'
        + '<button class="nvg-btn nvg-btn-secondary" id="nvg-p-to-code2">I already have a code</button></div>';
      document.getElementById('nvg-p-to-code2').addEventListener('click', function(){ payState.tab='code'; payState.submitted=false; renderPayBody(body); });
      return;
    }

    body.innerHTML = ''
      + '<div class="nvg-pay-box">'
      + '<p><strong>Monthly subscription: $' + SUBSCRIPTION_PRICE_USD + ' USD</strong></p>'
      + '<p>Pay via Telecel Cash to:</p>'
      + '<p style="font-family:\'DM Mono\',monospace;font-size:15px;">' + esc(TELECEL_CASH_NUMBER) + '<br>(' + esc(TELECEL_ACCOUNT_NAME) + ')</p>'
      + '<p>After paying, enter your details and the payment reference/transaction ID below. Once confirmed, you will receive a subscription code by email to unlock Core Skills onward for the month.</p>'
      + '</div>'
      + '<label>Name</label><input id="nvg-p-req-name" type="text" placeholder="Your full name">'
      + '<label>Email</label><input id="nvg-p-req-email" type="text" placeholder="you@example.com">'
      + '<label>Telecel Cash payment reference / transaction ID</label><input id="nvg-p-req-ref" type="text" placeholder="e.g. transaction code from your payment confirmation SMS">'
      + (payState.error ? '<div class="nvg-errbox">' + esc(payState.error) + '</div>' : '')
      + '<div class="nvg-btnrow"><button class="nvg-btn nvg-btn-primary" id="nvg-p-req-submit" style="width:100%;">Submit payment reference</button></div>'
      + '<div class="nvg-fieldnote"><a id="nvg-p-to-code">I already have a subscription code</a></div>';
    document.getElementById('nvg-p-to-code').addEventListener('click', function(){ payState.tab='code'; payState.error=null; renderPayBody(body); });
    document.getElementById('nvg-p-req-submit').addEventListener('click', onSubRequestSubmit);
  }

  async function onSubRequestSubmit(e){
    var name = document.getElementById('nvg-p-req-name').value.trim();
    var email = document.getElementById('nvg-p-req-email').value.trim();
    var paymentRef = document.getElementById('nvg-p-req-ref').value.trim();
    if(!name || !email || !paymentRef){
      payState.error = "Please fill in your name, email, and payment reference.";
      renderPayBody(document.getElementById('nvg-pay-body'));
      return;
    }
    payState.error = null;
    e.target.disabled = true; e.target.textContent = "Sending...";
    await submitForm({ formType: "nvivo_subscription", name: name, email: email, paymentRef: paymentRef });
    payState.submitted = true;
    renderPayBody(document.getElementById('nvg-pay-body'));
  }

  async function onSubCodeSubmit(){
    var name = document.getElementById('nvg-p-name').value.trim();
    var code = document.getElementById('nvg-p-code').value.trim();
    if(!name){ payState.error = "Please enter your name."; renderPayBody(document.getElementById('nvg-pay-body')); return; }
    if(!code){ payState.error = "Please enter your subscription code."; renderPayBody(document.getElementById('nvg-pay-body')); return; }
    payState.error = null;
    payState.checking = true;
    renderPayBody(document.getElementById('nvg-pay-body'));
    var result = await verifyCodeJSONP("verifyNvivoSubscription", code);
    payState.checking = false;
    if(result && result.valid){
      try{ await appStorage.set('nvivo-subscription-grant', JSON.stringify({name:name, code:code, expires: result.expires, grantedAt:new Date().toISOString()}), false); }catch(err){}
      window.__nvivoSubscriptionActive = true;
      var overlay = document.getElementById('nvg-paywall-overlay');
      if(overlay) overlay.remove();
      if(window.__mountNvivoApp) window.__mountNvivoApp();
      return;
    }
    payState.error = (result && result.reason === "expired")
      ? "That code has expired. Please renew below."
      : "That code wasn't recognized. Check it, or pay below to request one.";
    renderPayBody(document.getElementById('nvg-pay-body'));
  }

  /* ---- Full reset ----
     Clears everything this platform keeps on the device: module progress and quiz
     answers held by the course app, plus the access and subscription grants held
     by this gate. The storage fallback used outside claude.ai has no delete
     method, so the underlying localStorage key is removed directly as well. */
  function clearStoredKey(key){
    return new Promise(function(resolve){
      var done = function(){
        try{ localStorage.removeItem('nvivo_user:' + key); }catch(e){ /* storage unavailable */ }
        try{ sessionStorage.removeItem('nvivo_user:' + key); }catch(e){ /* storage unavailable */ }
        resolve();
      };
      if(hasNativeStorage && typeof window.storage.delete === 'function'){
        try{ window.storage.delete(key, false).then(done, done); return; }catch(e){ /* fall through */ }
      }
      done();
    });
  }

  async function resetEverything(){
    if(!confirm("Reset everything on this device? Your module progress, quiz answers, and your access and subscription codes will all be cleared. This cannot be undone.")) return;
    try{ localStorage.removeItem('nvivo-course-progress'); }catch(e){ /* storage unavailable */ }
    await clearStoredKey('nvivo-access-grant');
    await clearStoredKey('nvivo-subscription-grant');
    location.reload();
  }

  function mountResetButton(){
    if(document.getElementById('nvg-reset-btn')) return;
    // The gate stylesheet is injected with the gate markup, so on an already
    // unlocked device it has not been added yet.
    if(!document.getElementById('nvg-styles')){
      var holder = document.createElement('div');
      holder.innerHTML = styleTag();
      var st = holder.firstElementChild;
      if(st){ st.id = 'nvg-styles'; document.head.appendChild(st); }
    }
    var btn = document.createElement('button');
    btn.id = 'nvg-reset-btn';
    btn.className = 'nvg-reset';
    btn.type = 'button';
    btn.title = 'Clear module progress and saved codes from this device';
    btn.textContent = 'Reset device';
    btn.addEventListener('click', resetEverything);
    document.body.appendChild(btn);
  }

  function startApp(){
    accessGranted = true;
    var root = document.getElementById('root');
    root.innerHTML = '';
    if(window.__mountNvivoApp) window.__mountNvivoApp();
    mountResetButton();
  }

  // Rendered before any network call so start-up is never a blank screen.
  function renderBootStatus(container, message){
    container.innerHTML = styleTag()
      + '<div class="nvg-wrap"><div class="nvg-card">'
      + '<div class="nvg-sub" style="margin:0;">' + esc(message) + '</div>'
      + '</div></div>';
  }

  async function init(){
    window.__nvivoSubscriptionActive = false;
    var gate = document.getElementById('root');
    renderBootStatus(gate, "Checking your access\u2026");
    try{
      var hasAccess = await checkExistingAccess();
      await checkExistingSubscription();
      if(hasAccess){
        startApp();
        return;
      }
      renderRegistrationGate(gate);
    }catch(e){
      // Whatever went wrong, leave a usable screen rather than an empty one.
      console.error("Start-up error:", e);
      renderRegistrationGate(gate);
    }
  }

  if(document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', init);
  }else{
    init();
  }
})();
</script>
